; NarrativeEngine — plugin author / tester INI
;
; Lives at Data/SKSE/Plugins/NarrativeEngine.ini at runtime. Every key
; below can be omitted; the plugin falls back to the baked-in defaults
; in include/Settings.h.
;
; Universal MCM override cascade (Phase 08+): every key in this file
; can be overridden by naming the same key (same section, same name)
; in Data/MCM/Settings/NarrativeEngine.ini. The dashboard Settings tab
; and the MCM page both write to that file. Any key not present in the
; MCM INI falls through to the plugin-INI value below; the plugin INI
; itself is never written to by the plugin.
;
; A modder or advanced player who wants to override a specific knob at
; runtime (say, iBeatCooldownSeconds) can hand-edit the MCM INI and the
; plugin honors it on the next boot — even for the fifty-plus knobs
; that no UI surface edits. This file remains the on-disk source of
; truth for author defaults; the MCM INI is the on-disk source of
; truth for player-visible overrides.
;
; The MCM INI is also re-read live whenever the player changes a value
; in the MCM page (via the "_ne_DashboardHotkeyChanged" ModEvent fired
; by _ne_MCM.psc — the ModEvent name is legacy from Phase 07; the sink
; re-applies every recognized key, not just the hotkey).

[General]
; Debug-level logging on/off (0/1). When ON, the plugin emits an extra
; "Settings: debug mode ON" line at load, and other subsystems may emit
; their own per-tick / per-event debug lines.
bDebugMode=1
; Trace-level logging on/off (0/1). Independent of bDebugMode — turns on
; the noisiest per-tick / per-actor chatter (VisitConclusionPoll silence
; accumulator, AliasWalkFilter alias walks, HoldGrid per-worldspace prune
; reports) via logger::trace. Leave OFF unless you're actively hunting
; a bug in one of those subsystems; even short play sessions can emit
; thousands of lines.
bTraceMode=0

[BeatSystem]
; Master poll cadence for the Narrative Beat System's worker thread, in
; milliseconds. Every 250ms the poll wakes, reads the pause/combat/dialogue
; gates, ticks the global cooldown counter (if idle), and calls into the
; running beat's Tick (if a beat is in flight). See
; docs/implementation/PHASE_06_BEAT_SYSTEM_REFACTOR.md.
iBeatSystemPollIntervalMs=250

; Beat dispatch knobs.
;   iBeatCooldownSeconds         — wall-clock seconds after a beat's
;                                  completion before another may fire.
;   iBeatRepetitionWindowSeconds — window during which the same beat name
;                                  is excluded from candidate picks. Wider
;                                  than the cooldown so the SAME beat
;                                  can't fire back-to-back even after the
;                                  cooldown clears.
iBeatCooldownSeconds=120
iBeatRepetitionWindowSeconds=300

[Director]
; Wall-clock seconds between Director evaluations (the tick interval).
; TEMP: shortened from 90 to 30 for development iteration; revert before ship.
iTickIntervalSeconds=90
; Runtime killswitch initial state. 1 = tick runs; 0 = tick is
; disabled. The dashboard's Dispatch and Settings tabs can toggle this
; at runtime; either surface writes to the MCM INI so the state
; survives reboot. This key seeds the runtime Tick::g_enabled atomic at
; Tick::Start; the MCM INI override wins over this value on the next
; boot.
bTickEnabled=1
; Minimum dwell in the current phase (unpaused real-time seconds)
; before PhaseTracker::EvaluateAdvance is allowed to transition to the
; next phase. Applies uniformly to every phase — a single floor, not
; per-phase. Distinct from the per-phase iIdealDuration* values below,
; which gate whether the beat system may fire an event to nudge the
; story forward. Raise this if you want longer minimum dwell in each
; phase before advancement is even considered; lower it to make
; tension-driven advancement more responsive.
iMinPhaseDurationSeconds=30
; Persistent decision-log ring buffer cap.
iDecisionLogMaxEntries=200
; Number of recent decisions fed into narrative_engine_story_eval.prompt's
; `decision_log_tail` block per tick. Lower to shrink the tension-eval
; prompt when the LLM's context window is tight. Minimum enforced at 3 —
; dropping below starves the evaluator of its own recent continuity.
iDecisionLogTailSizeForPrompt=10
; Number of recent SkyrimNet events fed into narrative_engine_story_eval.prompt's
; `recent_events` block per tick (passed as maxCount to
; PublicGetRecentEvents). Same shrink-for-local-LLMs motivation as the
; other prompt caps. Minimum enforced at 5.
iSkyrimNetEventTailSizeForPrompt=40
; Per-current-phase tension thresholds (0..100) that drive Freytag-pyramid
; advancement. The LLM returns only a tension score; the system advances when
; the score crosses the threshold for the *current* phase. Each transition
; is either a "rises above" or "drops below" gate matching that phase's
; dramatic shape.
;   Exposition    -> RisingAction  when score >= iAdvanceThresholdExposition
;   RisingAction  -> Climax        when score >= iAdvanceThresholdRisingAction
;   Climax        -> FallingAction when score <= iAdvanceThresholdClimax
;   FallingAction -> Resolution    when score <= iAdvanceThresholdFallingAction
;   Resolution    -> Exposition    when score >= iAdvanceThresholdResolution
iAdvanceThresholdExposition=45
iAdvanceThresholdRisingAction=80
iAdvanceThresholdClimax=60
iAdvanceThresholdFallingAction=30
iAdvanceThresholdResolution=25
; Per-phase ideal durations (unpaused real-time seconds). The ActionDispatcher
; only considers firing an action after the current phase has overstayed its
; ideal duration. Total ideal cycle at defaults: 1200s (20 min).
iIdealDurationExposition=330
iIdealDurationRisingAction=225
iIdealDurationClimax=90
iIdealDurationFallingAction=225
iIdealDurationResolution=330

; NPCLetterAction precondition: minimum number of recently-engaged NPCs
; SkyrimNet must report before the letter action becomes available. Below
; this floor the LLM would have too thin a sender pool to author a credible
; letter, so the action declines and the dispatcher falls back to other picks.
iLetterMinSenderCandidates=3

; NPCVisitAction precondition: minimum number of viable sender candidates
; required for IsAvailable to return true. Below this, the action declines
; and the dispatcher considers other picks. Same shape as the letter
; equivalent, but the visit's viability filter is stricter (unique NPCs,
; not in combat, not the player's follower, etc.), so the practical pool
; is smaller than letters would see for the same engagement history.
iVisitMinSenderCandidates=3

[AlphaCanon]
; Comma-separated list of cell EditorIDs the Director will not act in.
; Empty by default. Example: WhiterunDragonsreach,RiftenJarlsLongHouse
sDoNotDisturbCellEDIDsCSV=
; Comma-separated list of Location EditorIDs the Director will not fire
; beats in. Checked before the beat-select LLM call is built, so no
; request is sent at all while the player is in one of these.
;
; Matching is inclusive of descendants: the player's current Location and
; every ancestor reached via its Parent Location is tested, so naming a
; parent covers its whole subtree. SovngardeLocation is on the list by
; default, which also covers SovngardeHallofHeroesLocation beneath it.
;
; Location EditorIDs are only retained at runtime when an EditorID-
; recovery mod (powerofthree's Tweaks or equivalent) is installed. Without
; one this list has no effect. Set to empty to disable the blacklist.
sBlacklistedLocationEDIDsCSV=SovngardeLocation

[Dashboard]
; DirectX scan code for the dashboard toggle. 65 = DIK_F7. Scan-code
; space is the native input space of SKSE's button events and MCM
; Helper's keymap sink, so an MCM-written value lands here directly
; without translation. A few common codes:
;   1  = Escape        16 = Q            30 = A
;   28 = Enter         17 = W            31 = S
;   57 = Space         18 = E            32 = D
;   59-68 = F1..F10    43 = Backslash    41 = Grave (`)
; Set to -1 to disable the hotkey entirely.
iHotkeyDXSC=65
; Modifier bitmask: 1=Shift, 2=Ctrl, 4=Alt. Combinable, exact-match.
; Bit assignment matches SkyUI convention so values written by the MCM
; page (via ModEvent) land here unchanged.
;   0 = no modifier required
;   3 = Shift+Ctrl
;   5 = Shift+Alt
;   6 = Ctrl+Alt
;   7 = Shift+Ctrl+Alt
iHotkeyModifiers=0

[CombatEvents]
; NarrativeEngine-owned combat event source. Hooks TESHitEvent,
; TESEnterBleedoutEvent, and (polled) player IsInCombat to feed
; combat_event entries into recent_events. Fills the gap
; SkyrimNet's event log leaves around moment-to-moment combat.
;
;   iHitRadiusUnits    — engine-unit radius around the player within
;                        which hit / bleedout events are captured.
;                        ~6000u ≈ 90ft — anything further isn't a
;                        story-relevant part of the player's scene.
;   iMaxStored         — ring-buffer cap on retained internal
;                        combat events (per-event, pre-condensation).
;   sSpellNameBlocklist — semicolon-separated list of spell / magic
;                        source names whose TESHitEvent captures
;                        should be discarded on receipt. Matched
;                        case-insensitively against the source
;                        form's Full Name; whitespace around each
;                        entry is trimmed. Empty by default. Use
;                        this to filter out buff / aura / cloak
;                        spells that hop between actors and fire
;                        TESHitEvent as they land — the engine
;                        emits them just like damaging hits, but
;                        they aren't attacks and shouldn't render
;                        as "A attacks B" in the combat log.
;                        Example (Requiem's guard-officer courage
;                        cloak, edid REQ_Cloak_GuardOfficer):
;                          sSpellNameBlocklist=Aura of Courage
;                        Multiple entries:
;                          sSpellNameBlocklist=Aura of Courage;Warmth Aura
iHitRadiusUnits=6000
iMaxStored=256
sSpellNameBlocklist=Aura of Courage

[WeatherEvents]
; NarrativeEngine-owned weather event source. Polls RE::Sky on a
; throttled cadence, emits weather_event entries into recent_events
; when the weather category (pleasant / cloudy / rainy / snowy, and a
; derived stormy bit) changes. Fills the gap SkyrimNet's event log
; leaves around ambient weather.
;
;   iWeatherEventsMaxStored           — ring-buffer cap on retained
;                                       internal events.
;   iWeatherEventPollIntervalSeconds  — minimum real seconds between
;                                       Sky samples. Weather updates
;                                       on the order of tens of
;                                       seconds; sampling every Tick
;                                       (500ms) would waste work
;                                       without new signal.
;   iWeatherEventDebounceSeconds      — minimum real seconds between
;                                       emitted events, applied on top
;                                       of the poll interval to
;                                       suppress rapid oscillation.
iWeatherEventsMaxStored=128
iWeatherEventPollIntervalSeconds=30
iWeatherEventDebounceSeconds=20

[TravelEvents]
; NarrativeEngine-owned travel event source. Polls player location
; and hold-region on every unpaused Tick, emits travel_event entries
; on transitions (entered/left named locations, crossed hold
; boundaries, entered wilderness, fast-travelled). Interior<->
; interior transitions are suppressed; interior<->exterior fire.
;
;   iTravelEventsMaxStored             — ring-buffer cap on retained
;                                        internal events.
;   iTravelCondensationWindowSeconds   — max inter-event gap within a
;                                        condensable run. Runs whose
;                                        events fall inside this
;                                        window collapse in the
;                                        rendered tail: net-zero runs
;                                        drop entirely or fold to a
;                                        "visited X" summary; non-zero
;                                        runs fold to a "travelled A
;                                        to B" summary.
;   iTravelFollowerRadiusUnits         — follower inclusion distance.
;                                        Any alive PlayerTeammate
;                                        within this radius at
;                                        emission time gets baked
;                                        into the event's party name
;                                        list. ~4000 units ≈ 60 ft.
iTravelEventsMaxStored=128
iTravelCondensationWindowSeconds=60
iTravelFollowerRadiusUnits=4000

[HoldGrid]
; Debug: dump one 24-bit BMP per worldspace to the SKSE log directory
; after HoldGrid finishes its BFS partition. Each hold gets a distinct
; color; seeded cells (locations that chained to LocTypeHold on their
; own) are black; unassigned cells are white. Overwrites existing
; files each session start. Disabled by default — flip to true only
; when auditing fill quality.
bHoldGridDebugBitmap=false
; Between seed collection and BFS, drop small seed clusters that are
; geographically far from the rest of their hold's seeds. Filters
; vanilla mis-authored strays that would otherwise seed a bad fill
; front. Setting either value to 0 disables the pass.
;
;   iHoldGridPruneMaxClusterSize   — K. Only same-hold seed clusters
;                                    (via 4-neighbor adjacency on the
;                                    seed set) of size <= K are
;                                    candidates for pruning. Default 3.
;   iHoldGridPruneIsolationRadius  — R. A candidate cluster is kept if
;                                    any same-hold seed OUTSIDE the
;                                    cluster lies within Manhattan
;                                    distance R of any cell in the
;                                    cluster; dropped otherwise.
;                                    Default 5 — empirically tuned
;                                    against vanilla Skyrim.
iHoldGridPruneMaxClusterSize=3
iHoldGridPruneIsolationRadius=5

[EventHistory]
; Testing aid: writes every emitted internal event (combat + weather
; + travel) plus SkyrimNet's own event stream to a running history
; file at Data/../SKSE/NarrativeEngine_EventHistory.log. Each line
; is prefixed with an absolute in-game timestamp (not the "[N ago]"
; relative form the LLM sees). Session boundaries rotate the file:
; current -> .1 -> .2 -> ... -> .5 (deleted). Keeps the previous 5.
;
;   bEventHistoryEnabled               — master switch. When false
;                                        (default), the file is never
;                                        opened AND each event log
;                                        skips its per-emit push to
;                                        the pending queue (so the
;                                        queue can't grow unbounded
;                                        on a long session with the
;                                        writer off). Flip to true
;                                        for Step 9 testing.
;   iEventHistoryFlushIntervalSeconds  — unpaused real seconds
;                                        between file flushes.
;                                        Weather/travel events emit
;                                        slowly; 5s trades off write
;                                        frequency vs. how long
;                                        events sit in pending queues.
bEventHistoryEnabled=false
iEventHistoryFlushIntervalSeconds=5

[Beats]
; Per-beat enable defaults. Seeded into the runtime registry at kDataLoaded
; and surfaced as toggles on the dashboard's Dispatch tab for isolation
; testing. Runtime toggles do NOT write back to this file — the INI is the
; source of truth every time the game boots. Set to false to force the
; Director's candidate list to exclude the beat outright.
bEnableNpcLetter=true

; NPC-letter beat / LetterPool knobs.
;   iLetterContentMinWords / iLetterContentMaxWords — bounds enforced on the
;       LLM-generated letter body. Responses outside these bounds are treated
;       as a content-LLM failure and the beat is rolled back.
;   iLetterPoolSize                                  — informational; the actual
;       pool size is fixed by the 20 _ne_PooledLetterNN forms in the ESP.
;   iLetterDispatchVerifyDelaySeconds                — wall-clock grace window
;       after start before dispatch-verification gives up if the letter
;       still isn't in the vanilla courier's inventory. The dispatch is
;       fire-and-forget so this poll is our only correctness signal.
;   iLetterPendingDeliveryTimeoutSeconds             — co-save reconciliation
;       gate: a slot found in PendingDelivery on load whose deliveredAt
;       (queued-with-courier time) is older than this is demoted to Free,
;       since the vanilla courier system has almost certainly advanced past
;       this entry already.
;   iLetterBeatCooldownGameHours                     — in-game hours the
;       npc_letter beat is blocked from IsAvailable after a successful
;       dispatch reaches the vanilla courier container. Independent of
;       (and additive to) the global iBeatCooldownSeconds real-time
;       cooldown. 0 disables.
;   iLetterSenderCooldownGameHours                   — in-game hours a
;       given sender NPC is excluded from LetterComposer's candidate
;       pool after the courier successfully hands the player a letter
;       from them. Prevents "three letters from the same NPC in one
;       session" repetition. 0 disables the filter.
;   fLetterMemoryImportanceThreshold                 — minimum SkyrimNet
;       `importance_score` (0.0–1.0) a memory must have to be surfaced
;       in the sender's memory tail. Memories below this floor never
;       reach the beat-select or compose prompts. Raise to filter
;       harder toward significant moments; lower to include lighter
;       context. Set to 0.0 to disable the filter.
;   iLetterComposeMemoryRenderCap  / iLetterComposeDialogueRenderCap —
;       upper bounds on how much sender context renders into the letter
;       compose prompt (narrative_engine_letter_compose.prompt). Lower
;       these to shrink the rendered prompt when the LLM's context
;       window is tight (mostly relevant for local models). Minimums
;       enforced at 3 (memory) and 5 (dialogue) — dropping below
;       produces threadbare letters. Only affects the compose prompt —
;       the candidate-pool memory tail used by beat-select is unaffected.
;   iActionSelectEventRenderCap                        — upper bound on
;       recent_events entries in narrative_engine_action_select.prompt.
;       Minimum 3.
;   iActionSelectLetterMemoryRenderCap / iActionSelectVisitMemoryRenderCap —
;       memories rendered per candidate sender in the action-select
;       prompt's letter and visit candidate blocks. Same shrink-for-
;       local-LLMs motivation as the compose caps. Minimum 3 each.
iLetterContentMinWords=60
iLetterContentMaxWords=150
fLetterMemoryImportanceThreshold=0.4
iLetterComposeMemoryRenderCap=6
iLetterComposeDialogueRenderCap=25
iActionSelectEventRenderCap=10
iActionSelectLetterMemoryRenderCap=6
iActionSelectVisitMemoryRenderCap=6
iLetterPoolSize=20
iLetterDispatchVerifyDelaySeconds=5
iLetterPendingDeliveryTimeoutSeconds=600
iLetterBeatCooldownGameHours=24
iLetterSenderCooldownGameHours=72

[LetterPool]
; Verbosity for slot-recycling log lines.
;   0 — silent
;   1 — log evictions (slot index, prior state, reason)  [default]
;   2 — log every state transition (Free / PendingDelivery / InInventory /
;       Read / Discarded) plus the eviction cleanup operations
iLetterPoolEvictionLogVerbosity=1

; ---- NPC-visit beat (Phase 05) settings (in [Beats] section) ----
;
; The [Beats] section above continues here — these keys were added in
; Phase 05 for the visit beat. Sub-grouped by function.

[Beats]
; Whether the visit action is registered with the dispatcher. Runtime
; dashboard toggles override this per-session but never write back.
bEnableNpcVisit=true

; --- Composition ---
;   iVisitBriefingMinWords / iVisitBriefingMaxWords — bounds on the LLM's
;       generated briefing. Responses outside are treated as a compose
;       failure and the action rolls back.
;   iVisitMarkerMinDistanceUnits / iVisitMarkerMaxDistanceUnits — distance
;       band the SpawnMarker FMR alias picks XMarkers within, relative to
;       the player. Baked into the CK-authored FMR conditions on the
;       SpawnMarker alias; changing these at runtime does NOT retroactively
;       update the alias behavior (documented here for reference).
;   iVisitComposeMemoryRenderCap / iVisitComposeDialogueRenderCap —
;       upper bounds on how much sender context renders into the visit
;       compose prompt (narrative_engine_visit_compose.prompt). Same
;       shrink-for-local-LLMs motivation as the letter-compose caps.
;       Minimums enforced at 3 (memory) and 5 (dialogue) — dropping
;       below produces threadbare visit briefs. Only affects the visit
;       compose prompt — the action-select visit candidate memory tail
;       has its own knob (iActionSelectVisitMemoryRenderCap).
;   iVisitConclusionPollRecentLinesRenderCap — max entries in the
;       `recent_lines` block of
;       narrative_engine_visit_conclusion_poll.prompt (the per-poll
;       LLM check that decides whether the ongoing visit has landed).
;       The tail of the filtered dialogue history is taken, so lower
;       values just narrow the visible window without losing
;       chronology. Minimum enforced at 3.
iVisitBriefingMinWords=40
iVisitBriefingMaxWords=120
iVisitMarkerMinDistanceUnits=800
iVisitMarkerMaxDistanceUnits=2500
iVisitComposeMemoryRenderCap=6
iVisitComposeDialogueRenderCap=25
iVisitConclusionPollRecentLinesRenderCap=8

; --- Cooldowns ---
;   iVisitSenderCooldownGameHours — per-sender cooldown in in-game hours,
;       stamped when a visit's Salutation → Discuss transition fires. That
;       NPC is filtered out of the visit candidate pool for this many
;       in-game hours to prevent them from being picked again immediately.
;       0 disables the filter. Persists per-sender-FormID in the action's
;       co-save record.
iVisitSenderCooldownGameHours=72

; --- State machine timing ---
;   iVisitApproachTimeoutSeconds — Salutation timeout. If the sender hasn't
;       walked close enough to speak the opening line within this many
;       seconds, the action rolls back and the sender is teleported home.
;   iVisitSalutationApproachDistanceUnits — distance at which the Salutation
;       opening line fires and the state machine advances to Discuss.
;   iVisitReEngageApproachDistanceUnits — after On-Hold clears, the sender
;       must close within this distance again for the resumption line to
;       fire. Defaults to the same value as Salutation but tunable
;       independently.
iVisitApproachTimeoutSeconds=60
iVisitSalutationApproachDistanceUnits=1000
iVisitReEngageApproachDistanceUnits=1000

; --- Discuss-phase natural-conclusion poll (cheap-signal-gated) ---
;   iVisitPollGateTickSeconds — wall-clock cadence at which the plugin
;       evaluates the three cheap-signal gates that decide whether to fire
;       the LLM poll. Cheap by design: three integer/timestamp comparisons
;       per tick.
;   iVisitPollTurnCountThreshold — speech turns observed since the last
;       poll before a poll fires. Rough proxy for ~30 real sec of active
;       exchange at typical pacing.
;   iVisitPollSilenceRealSeconds — real seconds of silence since the last
;       observed speech turn before a poll fires. Accumulation pauses while
;       the game is paused (RE::UI::GameIsPaused — journal / inventory /
;       map / load screens), so this measures actual "the player has been
;       looking at the sender doing nothing" time, independent of the
;       user's iTimescale. Also doubles as the "silence exceeded -> fire
;       ContinueConversation" threshold when the poll returns not-concluded.
;   iVisitPollMaxIntervalGameMinutes — in-game minutes since the last poll
;       before a poll fires as a safety ceiling. Guarantees the LLM verdict
;       refreshes even during a productive back-and-forth that never trips
;       the other gates. Same in-game-time measurement.
;   iVisitConclusionPollMaxConsecutiveFailures — consecutive poll failures
;       (parse errors / LLM errors) before hard-abort. Prevents the visit
;       from running indefinitely on a broken poll.
;   iVisitMaxIgnoreNudges — consecutive ContinueConversation fires without
;       a poll ever returning "concluded" in between. On this cap, the
;       plugin forces Valediction with elevated nudge_count in the args so
;       the closing line reads as a frustrated exit.
iVisitPollGateTickSeconds=1
iVisitPollTurnCountThreshold=4
iVisitPollSilenceRealSeconds=120
iVisitPollMaxIntervalGameMinutes=10
iVisitConclusionPollMaxConsecutiveFailures=6
iVisitMaxIgnoreNudges=3

; --- Other timeouts / dwells ---
;   iVisitOnHoldCombatMaxSeconds — how long On-Hold may persist while
;       combat is the trigger before hard-abort. Combat-driven On-Hold has
;       a short leash because a fight going long usually means the beat
;       won't recover cleanly.
;   iVisitValedictionDwellSeconds — wall-clock seconds between the
;       Valediction closing line and the ReturnHome transition. Gives the
;       closing line time to play out before the sender turns to leave.
;   iVisitReturnHomeExitDistanceUnits — sender-to-player distance during
;       ReturnHome that triggers the final teleport + shutdown. Offscreen
;       for most gameplay framing.
;   iVisitReturnHomeTimeoutSeconds — outer wall-clock cap on ReturnHome.
;       If the sender is still walking (hasn't hit distance / cell-unload)
;       after this many seconds, teleport anyway.
iVisitOnHoldCombatMaxSeconds=60
iVisitValedictionDwellSeconds=10
iVisitReturnHomeExitDistanceUnits=8000
iVisitReturnHomeTimeoutSeconds=300

; ---- Ambush beat (Phase 11) settings (in [Beats] section) ----
;
; The [Beats] section continues here — these keys were added in Phase 11
; for the ambush beat. Sub-grouped by function.
;
; NOTE: *which* enemies can ambush you is NOT configured here. That table
; lives in its own file, Data/SKSE/Plugins/NarrativeEngine/AttackerGroups.ini,
; because it is content rather than tuning — adding a group, or disabling
; one you don't want, is a text edit there with no rebuild. This section
; only controls how many attackers appear, how far away, and when the
; encounter ends.

[Beats]
; Whether the ambush beat is registered with the dispatcher. Runtime
; dashboard toggles override this per-session but never write back.
bEnableAmbush=true

; --- Attacker count ---
;   The Director picks how many attackers an ambush fields; these bound
;   its answer. An omitted or out-of-range choice falls back to the
;   default rather than failing the beat.
;
;   iAmbushMaxAttackerCount is additionally clamped to 8 — the number of
;   Attacker01..Attacker08 aliases authored on _ne_AmbushQuest. Every
;   spawned attacker is held in one of those alias slots, so there is
;   nowhere to put a ninth. Setting this higher logs a warning and
;   clamps; raising the real ceiling means authoring more aliases in the
;   ESP first.
iAmbushDefaultAttackerCount=3
iAmbushMinAttackerCount=2
iAmbushMaxAttackerCount=6

; --- Spawn distance ---
;   How far from the player attackers materialize, in game units
;   (~64 units = 1 metre). This is entirely settings-driven; the
;   Director has no say in where attackers appear.
;
;   The search starts at the default and widens toward the max hunting
;   for a spot the player can't currently see, staying inside this band
;   the whole way. It never goes below the minimum: spawning closer
;   risks the player watching attackers appear out of thin air, which
;   reads as a bug rather than an ambush.
;
;   Preference order: somewhere ahead of you or off to either side is
;   ideal — an ambush should be walked into. Behind you is a fallback,
;   used only when nothing in the forward arc is hidden well enough.
iAmbushDefaultSpawnDistanceUnits=2500
iAmbushMinSpawnDistanceUnits=2500
iAmbushMaxSpawnDistanceUnits=5500

; --- Engagement ---
;   iAmbushEngageDistanceUnits — attackers approach non-hostile (so the
;       travel package keeps control and they actually path to you), then
;       turn hostile once they close to within this distance. Lowering it
;       makes them close silently before striking; raising it makes them
;       charge from further out.
iAmbushEngageDistanceUnits=1500

; --- How the encounter ends ---
;   An ambush ends one of three ways: every attacker dies, the player
;   outruns it, or it times out. The last two are "abandoned" and still
;   stamp the cooldown — the beat happened, the player just left.
;
;   iAmbushAbandonDistanceUnits — once EVERY surviving attacker is beyond
;       this distance, the encounter is abandoned and the survivors are
;       deleted. Wants real clearance above iAmbushMaxSpawnDistanceUnits,
;       not just a little: an encounter that spawned at the far end of
;       the band would otherwise abandon itself as soon as you kept
;       walking. A value at or below the spawn maximum is raised
;       automatically.
;   iAmbushMaxDurationSeconds — outer cap on a running ambush, in
;       unpaused real seconds. Catches the case where attackers can't
;       reach the player at all (bad terrain, a locked-off ledge).
;   iAmbushPerBeatCooldownGameHours — in-game hours before another ambush
;       can fire. Stamped on completion and on either abandonment route,
;       but NOT when composition fails — a failed spawn shouldn't cost
;       you a day of ambushes.
iAmbushAbandonDistanceUnits=8000
iAmbushMaxDurationSeconds=600
iAmbushPerBeatCooldownGameHours=24

; Stuck recovery — spawned actors that can't travel.
;
; A spawn point can pass every validation gate and still leave an actor
; unable to walk anywhere: the search validates a POSITION, the engine
; moves a COLLISION CAPSULE, and the two disagree wherever geometry the
; navmesh nominally covers can't actually be traversed. Attackers have
; been observed wedged inside boulders and beached on waterfalls. The
; escort watches for it and moves them.
;
;   iStuckRecoveryCheckIntervalSeconds — how often each spawned actor's
;       position is compared against where it was last time. Long enough
;       that an actor merely turning around or walking a detour isn't
;       judged prematurely.
;   iStuckRecoveryMovementThresholdUnits — movement below this across one
;       interval counts as stalled, and the actor is warped to a
;       validated-but-unused spawn point (or, once those run out, closer
;       to the player). Read this together with the interval above: the
;       pair is really one setting, "slower than this counts as stopped".
;       Raise the threshold or shorten the interval to intervene sooner,
;       at the cost of false positives on actors picking their way
;       around obstacles.
iStuckRecoveryCheckIntervalSeconds=4
iStuckRecoveryMovementThresholdUnits=100

[TravelGraph]
; EXPERIMENTAL — diagnostic only. Nothing in the plugin consumes this
; graph yet.
;
; Skyrim ships one NAVI record (Navigation Mesh Info Map) containing,
; among other things, a set of precomputed "preferred path" chains:
; ordered sequences of navmeshes forming long-distance routes. The
; engine uses them to move actors that are travelling while outside the
; loaded cell grid, which is why an NPC on a long travel package still
; appears to follow roads when nobody is watching. Plotted end to end,
; those chains trace the road network.
;
; TravelGraph reconstructs that at kDataLoaded: one node per exterior
; navmesh that participates in a chain, edges between consecutive
; entries. Chains that share road merge into real junctions, so the
; result is a graph rather than a bundle of parallel routes.
;
; Node spacing is navmesh-sized (roughly one 4096-unit cell), so this is
; a road skeleton, not a unit-accurate polyline.
;
;   bTravelGraphEnabled            — build the graph at all. Costs a few
;                                    ms and some memory; set false to
;                                    skip entirely.
;   bTravelGraphDebugBitmap        — dump one 24-bit BMP per worldspace
;                                    to the SKSE log directory. Nodes
;                                    black, edges gray, empty space
;                                    white; worldspaces with no nodes
;                                    are skipped. Overwrites each
;                                    session. Turn off once you've
;                                    eyeballed the output.
;   iTravelGraphBitmapUnitsPerPixel — world units per pixel. Lower means
;                                    a bigger, more detailed image. 256
;                                    renders Tamriel at about 1330x820.
;                                    Raised automatically if it would
;                                    produce an image over 4096px wide.
bTravelGraphEnabled=false
bTravelGraphDebugBitmap=false
iTravelGraphBitmapUnitsPerPixel=256
; Diagnostic: log runner-up candidate offsets from the BSNavmeshInfo
; layout calibration. The calibration itself always runs and is not
; optional -- only ~15% of navmeshes have a resident NavMesh form at
; kDataLoaded, and the rest can only be positioned by reading the info
; struct, whose layout CommonLibSSE-NG does not define. Rather than
; hardcode offsets, the plugin measures them each session against the
; navmeshes it CAN position independently, and falls back to cell-centre
; positions if the measurement fails. This key only controls how much
; detail that reports.
bTravelGraphLogCalibration=false

[FineRoads]
; EXPERIMENTAL -- diagnostic only. Nothing in the plugin consumes this
; graph yet.
;
; TravelGraph carries Skyrim's long-distance routing skeleton: roughly
; 620 nodes for all of Tamriel, spaced about one cell apart, major roads
; only. It has no spurs, because a track that dead-ends at a barrow is
; useless for cross-map routing and was never generated into that data.
;
; The detail is in the navmesh itself. Individual triangles carry a
; "preferred" flag, and the flagged triangles form the real road surface
; -- side paths, dead ends, and the true curve of the road rather than
; the skeleton's corner-cutting. The catch is that triangle geometry is
; only in memory for cells that are actually loaded, so this graph is
; local: it covers the loaded cell grid and travels with the player.
;
; Extraction results are cached per cell for the session, so crossing
; back over a boundary costs nothing. Cells that unload leave the active
; graph but stay cached.
;
;   bFineRoadsEnabled             -- build the local graph at all.
;   iFineRoadsBackstopSeconds     -- rescans are normally event-driven:
;                                    cell-loaded, load-game and
;                                    fast-travel-end sinks flag the graph
;                                    and the next tick picks it up. This
;                                    is only a backstop, in unpaused
;                                    seconds, and exists because cell
;                                    UNLOADS have no event of their own.
;                                    An unload unaccompanied by any load
;                                    would otherwise leave stale cells in
;                                    the active set indefinitely.
;                                    It may well be dead weight: the grid
;                                    shifts as a unit, so an unload almost
;                                    always arrives alongside a load whose
;                                    event triggers the rescan anyway.
;                                    Kept because the failure it guards
;                                    against is silent, and the cost is
;                                    one grid scan every few minutes.
;   bFineRoadsDebugBitmap         -- dump the active graph to
;                                    NarrativeEngine_FineRoads.bmp in the
;                                    SKSE log directory whenever it
;                                    changes. Road nodes red, frontier
;                                    nodes (where the road leaves loaded
;                                    cells) blue, edges gray.
;   iFineRoadsBitmapUnitsPerPixel -- world units per pixel for that
;                                    bitmap. Much finer than
;                                    TravelGraph's, since this covers
;                                    about 5x5 cells rather than a whole
;                                    worldspace.
bFineRoadsEnabled=false
iFineRoadsBackstopSeconds=180
bFineRoadsDebugBitmap=false
iFineRoadsBitmapUnitsPerPixel=16

[Gossip]
; Background rumor propagation across Skyrim's unique-actor population.
; Full design and the offline validation that produced these defaults:
;   docs/implementation/PHASE_13_GOSSIP_PROPAGATION.md
;   docs/implementation/PHASE_13_MILESTONE_2.md
;   docs/implementation/tests/gossip-spread/PHASE_13_SIR_VALIDATION_LOG.md
;
; SHIPS DISABLED pending in-game validation. Every transmission writes two
; real memories into SkyrimNet's memory database and does NOT clean them
; up. Enable on a save you are willing to leave gossip in.
;
;   bGossipEnabled              -- master switch for the whole subsystem.
;   bGossipLogEnabled           -- the dedicated rumor trace at
;                                  NarrativeEngine_Gossip.log. Independent
;                                  of bDebugMode on purpose, so a long
;                                  validation run can have a quiet main
;                                  log and a complete gossip trace.
;   iGossipTickIntervalSeconds  -- how often the plugin thread CHECKS whether
;                                  a scheduled gossip tick has come due, in
;                                  unpaused real seconds. Not how often gossip
;                                  runs: that is fGossipHarvestIntervalGameHours
;                                  below, measured in game time.
;
;                                  The check is a few microseconds -- accumulate,
;                                  compare, enqueue -- because the tick itself
;                                  runs on gossip's own worker thread.
;   iGossipMaxEventsPerTick     -- runaway backstop on one tick's simulation
;                                  drain. There is no time budget any more; the
;                                  drain runs to completion because nothing else
;                                  shares its thread and there is nobody to yield
;                                  to. Set high enough that it should never bind.
;                                  If it ever does, the trace says so explicitly
;                                  and it means something is looping, not that
;                                  the world got busy.
;
;                                  The predecessor of this setting was a
;                                  wall-clock budget of 8ms per firing, needed
;                                  only because gossip shared a queue with every
;                                  other subsystem. It was a tax on the
;                                  simulation to protect the weather log.
bGossipEnabled=false
bGossipLogEnabled=false
iGossipTickIntervalSeconds=2
iGossipMaxEventsPerTick=5000

; Contact model -- the seven-rung ladder.
;
; A conversation picks a RUNG first, by these relative weights, and only then
; picks a peer uniformly from whoever is on it. Doing it in that order is the
; whole design: the channel mix becomes something chosen, instead of something
; that falls out of how many people happen to live in each tier.
;
; The odd rungs are geographic. The even rungs have NO natural membership --
; they hold only peers a shared faction or a relationship has moved. That is
; what keeps a guild-mate three holds away reachable: on their own rung they
; are a pool of two or three, where mixed into the hold they would be two or
; three among a hundred and never come up. Measured offline, that one change
; took cross-hold spread from 1% of rumors to 15%.
;
;   1 Household   2   3 Settlement   4   5 Hold   6   7 Province
;
; KEEP THIS MONOTONIC: each rung should be <= the rung closer than it. A peer
; moved outward must end up spoken to less, not more, or the ladder stops
; meaning anything. Nothing enforces it at load time, because running a
; deliberate experiment is legitimate.
;
; Rung 6 does not need to be loud to work. It carries about 1% of all
; tellings and still produces the entire cross-hold band -- the point was
; never its weight, it was giving distant ties a pool of their own.
;
; Defaults measured against the vanilla graph (857 participants) over a month
; of in-world time; see docs/implementation/tests/gossip-spread/simulate-tiered.py.
;
; The province rung was raised from 0.01 after a 30-day in-game run crossed a
; hold boundary only 5 times in 215 tellings. It is the one rung that is never
; empty, so it is the only reliable long-range channel -- the cost is that the
; route is arbitrary, a chance meeting rather than a guild carrying word, which
; is why it is a fallback behind admitting the Civil War factions in
; GossipFactions.ini rather than the first thing reached for.
;
; fGossipConversationsPerStep is how many conversations a carrier holds per
; SIMULATION step (fGossipStepDays), not per gossip tick. Those are separate
; clocks on purpose: tying conversations to the tick would make the harvest
; cadence silently change how fast rumors spread.
fGossipConversationsPerStep=5.0
fGossipTierWeightHousehold=0.33
fGossipTierWeight2=0.20
fGossipTierWeightSettlement=0.18
fGossipTierWeight4=0.12
fGossipTierWeightHold=0.09
fGossipTierWeight6=0.06
fGossipTierWeightProvince=0.02

; SIR model. Susceptible -> Infectious (fixed period) -> Recovered (immune
; forever). Transmissibility is CONSTANT for a rumor's whole life: a rumor does
; not get less catching because it has changed hands. An outbreak ends when
; conversations start landing on people who already know.
;
;   fGossipInfectiousDays    -- how long an NPC keeps bringing a rumor up.
;   fGossipTransmissionScale -- per-conversation transmission probability is
;                               notability x this.
;   fGossipStepDays          -- simulation step in game days; each step a
;                               carrier holds fGossipConversationsPerStep
;                               conversations. Smaller is finer and costs
;                               proportionally more events.
;
; A longer infectious period at a LOWER probability is what decouples the
; tiers: household saturation needs only a few successes out of many attempts,
; while outward spread is governed by the probability.
fGossipInfectiousDays=3.0
fGossipTransmissionScale=0.055
fGossipStepDays=0.25

; Hard state bounds, so the co-save payload cannot grow with playthrough
; length.
;
; iGossipMaxLiveRumors was 12 for the first SIR run and silently throttled the
; harness: SeedRumor refuses while the cap is full, and under SIR rumors live
; long enough to keep it full, so only a third of the configured seeds landed.
; At 40 x 80 carriers the co-save payload is ~95 KB, which is fine for a
; validation harness but should come back down before anything ships.
iGossipMaxLiveRumors=40
iGossipMaxCarriersPerRumor=150
iGossipCarrierMaxAgeDays=30

; Faction co-membership band. Size alone does not separate social groups
; from attribute buckets -- JobInnkeeperFaction has 29 mutual strangers
; while a 3-member manor faction shares a roof. The name filter in
; NarrativeEngine_GossipFactions.ini does the rest of the work.
iGossipFactionSizeMin=3
iGossipFactionSizeMax=40

; --- Milestone 2: memory harvesting ------------------------------------------
; Rumors are sourced from SkyrimNet's memory database rather than planted.
; There is no global memory query -- GetMemoriesForActor is strictly per-actor
; -- so a sweep draws one bucket of the participant population and queries
; every member of it. Selection deliberately does not rank: any ranking
; available to us measures interaction with the PLAYER, which would make the
; gossip mill report the player's own itinerary back at them.
;
; fGossipClaimExpiryDays MUST EXCEED fGossipHarvestWindowDays. A memory claimed
; the instant it was created has its claim expire at the former but stops being
; harvestable at the latter, so the claim always outlives eligibility and the
; memory can never seed twice. Invert them and the same story circulates twice.
; Settings::Load complains loudly if this is violated.
;
; Gossip is kept out of its own input by the "ne_gossip" tag it writes on every
; memory it creates, which the harvester filters on directly. There is no
; memory-type allowlist: one existed while that tag was believed unavailable
; at read time, and it did nothing but discard the best material on the save.
bGossipHarvestEnabled=true
fGossipHarvestIntervalGameHours=12.0
fGossipHarvestWindowDays=50.0
fGossipClaimExpiryDays=60.0
fGossipMinMemoryImportance=0.45
;
;   fGossipMemoryImportanceCeiling
;                               -- the ceiling on the importance of the
;                                  memories a TRANSMISSION writes. Not the
;                                  rumor's notability, which is the
;                                  importance of the ORIGINAL memory the
;                                  rumor was harvested from.
;
;                                  Hearing a story about something is never
;                                  as memorable as the thing itself, so
;                                  notability is rescaled from 0..1 onto
;                                  0..this before it is written. The
;                                  relationship stays proportional -- a
;                                  rumor twice as notable still writes
;                                  memories twice as important -- but the
;                                  whole band sits below the event.
;
;                                  Level with fGossipMinMemoryImportance on
;                                  purpose: hearsay tops out exactly at the
;                                  bar a memory must clear to become a
;                                  rumor, so gossip's output can never
;                                  outrank the material it is made from.
;                                  That is a backstop behind the ne_gossip
;                                  tag, not a replacement for it.
fGossipMemoryImportanceCeiling=0.45
;
;   iGossipHarvestBuckets       -- how many buckets the participant population
;                                  splits into. Every participant is assigned
;                                  to exactly one, by a hash of their base
;                                  FormID, and one whole bucket is examined per
;                                  sweep. This is the cost lever, traded
;                                  against how long an NPC waits for a turn:
;
;                                    10 -> ~88 queries/sweep, a turn every ~5 game days
;                                    20 -> ~44 queries/sweep, a turn every ~10 game days
;                                    40 -> ~22 queries/sweep, a turn every ~20 game days
;
;                                  (against 881 participants at the default
;                                  12-game-hour interval.)
;
;                                  Changing this mid-playthrough reassigns
;                                  every participant, so the saved selection
;                                  history stops denoting the same people and
;                                  is discarded on load.
;
;
;   iGossipBucketHistoryLength  -- how many of the most recent bucket
;                                  selections are excluded from the next draw.
;                                  The draw is uniform over whatever is left,
;                                  so this controls how ordered the sequence
;                                  is without ever making it a counter.
;
;                                  -1 (the default) means bucketCount-1, and
;                                  follows iGossipHarvestBuckets rather than
;                                  pinning a number beside it. That is the
;                                  exact-cycle setting: one bucket eligible per
;                                  draw, so every bucket gets a turn every
;                                  iGossipHarvestBuckets sweeps, with no tail.
;
;                                  A shorter history leaves real choice in the
;                                  draw. Nothing in the game can observe that
;                                  choice -- only the trace sees the order --
;                                  and it is paid for in waiting: at 10
;                                  buckets, a history of 6 keeps the mean wait
;                                  at 10 sweeps but stretches the worst case
;                                  from 10 to 33.
;
;                                  A non-negative value is used literally,
;                                  clamped to bucketCount-1.
;
iGossipHarvestBuckets=10
iGossipBucketHistoryLength=-1
;
;   iGossipHarvestMemoriesPerActor
;                               -- rows to ask SkyrimNet for, per actor.
;
;                                  These are the N most RECENT memories that
;                                  pass every filter the harvest asks for --
;                                  SkyrimNet applies the tag, window and
;                                  importance rules in SQL BEFORE it
;                                  truncates to this count (API v10+), so the
;                                  rows that come back are all usable.
;
;                                  The sweep then ranks everything the whole
;                                  bucket returned by importance and takes
;                                  the best few, so raising this widens how
;                                  far back a single actor can contribute,
;                                  not how good the winner is.
;
;                                  Set clear of where the cut was seen to
;                                  bind, without pretending to be unbounded.
;                                  At 10 a live run truncated exactly the
;                                  actors worth harvesting -- 11 of them came
;                                  back holding precisely 10 rows, all
;                                  College mages with deep memory stores,
;                                  while everyone else returned one to nine.
;                                  Newest-first then hides their older but
;                                  weightier memories from the importance
;                                  ranking that picks the winner.
;
;                                  Still a real bound: an actor whose store
;                                  outgrows it is capped rather than pulled
;                                  in whole. Costs one bigger response, never
;                                  more calls, and only for actors who have
;                                  that many rows past every filter.
;
iGossipHarvestMemoriesPerActor=30
; iGossipMaxSeedsPerHarvest is how many rumors one sweep may actually seed;
; iGossipEvalAttemptsPerHarvest below is how many candidates it may consider
; in order to find them.
iGossipMaxSeedsPerHarvest=1
;
;   iGossipEvalAttemptsPerHarvest
;                               -- how many candidates a sweep may put to the
;                                  evaluator before giving up. The sweep takes
;                                  this many eligible candidates, shuffles them,
;                                  and evaluates one at a time until it has
;                                  seeded iGossipMaxSeedsPerHarvest rumors or
;                                  run out.
;
;                                  At 1, a single refusal wasted the entire
;                                  sweep even when good candidates were ranked
;                                  right behind it — and about a third of
;                                  evaluations come back refused.
;
;                                  Raising this does NOT raise the usual cost:
;                                  the walk stops at the first acceptance, so
;                                  the expected spend is ~1.5 evaluation calls
;                                  per sweep either way. It only buys cover for
;                                  the unlucky sweep where several in a row are
;                                  refused.
iGossipEvalAttemptsPerHarvest=5

; An origin whose contacts are all unreachable cannot spread anything, and
; seeding from one burns a rumor slot and an LLM call for nothing. This is the
; share of an origin's LOCAL rung weight (rungs 1-6; province is excluded, as
; it is for the stall test) that sits on a rung holding at least one person
; able to hold a conversation -- alive, not disabled, not bleeding out.
;
; READ THE NUMBER CAREFULLY: it is a share of WEIGHT, not of people. A carrier
; with no household, no settlement and no ties scores 9% while having ninety
; perfectly reachable hold-mates, because the one rung they can use carries
; 9% of the ladder. Orthorn -- a College apprentice the questline stages alone
; in Fellglow Keep, with no factions and no relationships in his record -- is
; exactly that case.
;
; 0.05, not the 0.25 this started at. That figure was set against the old flat
; contact model, where the share genuinely meant "this fraction of your
; conversations reach a live person" and 9% was dire. Under the ladder the
; empty rungs come back SILENT instead, which the model already charges for:
; such a carrier talks at a ninth of the normal rate. Gating them out on top
; of that is charging twice, and it excluded 103 of 857 participants (12%),
; 69 of them at exactly that 9% signature.
;
; No participant in the vanilla graph scores 0, so at 0.05 this reduces to
; "has anyone at all", which is the question worth asking now. What it still
; catches is the case it was built for: rungs that are populated but whose
; occupants are all dead or quest-disabled. Ancano seeded five rumors in one
; test session and every one reached nobody, with 61% of conversations going
; to unavailable listeners.
fGossipMinAvailableContactShare=0.05

; --- Milestone 2: rumor content ----------------------------------------------
; All bands are produced by ONE call at seed time. Band edges at generation 3
; and 6; measured depth reaches 12 but generations 9+ carry only 4% of traffic.
;
; The prompt asset and the LLM variant are deliberately NOT settings. The
; prompt ships with the mod and its contract with the plugin -- the context
; keys it reads, the JSON it must return -- is compiled in, so repointing it
; could only break the call. Gossip runs under the existing
; narrative_engine_composer variant, which already covers creative writing in
; an NPC's voice; a variant of its own would be another knob with no distinct
; task shape behind it.
iGossipContentBands=3

; RNG seed for the simulation's peer selection. Fixing it makes a run
; repeatable, which is what makes a tuning change measurable against the
; previous one. 0 derives the seed from the session instead.
iGossipRandomSeed=1337
