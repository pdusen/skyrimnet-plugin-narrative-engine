; ============================================================================
; NarrativeEngine — Gossip faction filter
; ============================================================================
;
; Decides which vanilla factions count as SOCIAL GROUPS (people who actually
; talk to each other) versus ATTRIBUTE BUCKETS (people who merely share a
; property and are otherwise strangers).
;
; Why this file exists
; --------------------
; The obvious filter is faction size, and it does not work. Measured on a
; vanilla + DLC load order:
;
;   JobInnkeeperFaction        29 members — every innkeeper in Skyrim.
;                                           None of them have met.
;   DLC2RRSeverinManorFaction   3 members — they share a roof.
;
; Size is uncorrelated with sociality. Applying a 3–40 size band alone admits
; 230 factions and 10,001 co-membership pairs; adding the name filter below
; cuts that to 113 factions and 2,687 pairs. Roughly 73% of what size alone
; admits is junk.
;
; The second class below (quest and scripting scaffolding) matters more than it
; looks. Those factions span holds for reasons that have nothing to do with who
; talks to whom — PlayerHousecarlFaction covers 8 holds — and while they were
; admitted they dominated the cross-hold transmission count, making gossip look
; far more province-spanning than it actually is. Excluding them dropped the
; share of rumors leaving their origin hold from 32% to 17%.
;
; See docs/implementation/PHASE_13_GOSSIP_PROPAGATION.md for the full
; measurement, and tests/gossip-spread/PHASE_13_SIR_VALIDATION_LOG.md for the
; propagation run it fed.
;
; How to use it
; -------------
;   [Deny]  Fragment=<substring>   Case-insensitive. A faction whose EditorID
;                                  CONTAINS this substring is excluded.
;                                  Repeat the key as many times as needed.
;
;   [Allow] EditorID=<exact name>  Case-insensitive exact match. Overrides any
;                                  Deny hit. Use this to rescue a specific
;                                  faction the fragments over-match.
;
; A faction must ALSO fall inside iGossipFactionSizeMin..Max (set in
; NarrativeEngine.ini) to be admitted. This file only removes; it never adds a
; faction that failed the size band.
;
; If this file is missing entirely, the plugin falls back to a built-in copy of
; the Deny list below and an empty Allow list. Deleting it degrades the filter,
; it does not break the feature.
;
; Editing this file needs no rebuild of the plugin — but it DOES need
; build.ps1 to copy it into the mod folder if you are editing the source tree
; rather than the deployed one.
;
; ============================================================================

[Deny]

; ---- Attribute buckets ------------------------------------------------------
; Everyone who shares a property, mutual strangers to one another.
Fragment=crime
Fragment=town
Fragment=job
Fragment=potential
Fragment=current
Fragment=favor
Fragment=gov
Fragment=guard
Fragment=trainer
Fragment=vendor
Fragment=friend
Fragment=nopickpocket
Fragment=marriage
Fragment=follower
Fragment=playerfaction
Fragment=excluded
Fragment=prisoner
Fragment=bard
Fragment=witness
Fragment=shared
Fragment=generic

; ---- Quest and scripting scaffolding ---------------------------------------
; Not social groups at all. These are the entries that most distort cross-hold
; behaviour when admitted; see the header.
Fragment=alias
Fragment=partyguest
Fragment=housecarl
Fragment=carriage
Fragment=adoptable
Fragment=disallow
Fragment=castlehide
Fragment=additem
Fragment=exclusion
Fragment=neverfill
Fragment=council
Fragment=immune
Fragment=hide
Fragment=dialogue
Fragment=scene
Fragment=patrons

; ---- Corpse-handling and creature groupings --------------------------------
; Added after the third validation run, where these produced 3 of the 8
; observed hold crossings. They are not social groups by any reading:
; WINoBodyCleanupFaction exempts corpses from the world-interaction cleanup
; sweep, so its members are dead NPCs scattered across the province, and the
; draugr factions are crypt-dwelling undead. Both were quietly acting as
; province-spanning "organisations" and inflating cross-hold spread with
; transmissions between actors who cannot talk to anyone.
Fragment=nobodycleanup
Fragment=draugr

; NOT denied, despite looking like it belongs here: `dead`. It is a substring
; trap. It matches FalkreathDeadMansDrinkFaction (an inn), the two Hall of the
; Dead factions (priests of Arkay who live and work together), and even
; SolitudeAddvarsHouseFaction ("soliTUDE-ADDvars"). All four are genuine social
; groups and the first was an active gossip channel in the third validation
; run. Fragments are matched as bare substrings anywhere in the EditorID, so
; short ones need checking against the real faction list before being added.

[Allow]

; The Civil War organisations. `Fragment=gov` catches all three, and it is
; right to catch GovRuling's neighbours -- but these are not attribute buckets.
; They are the only province-spanning INSTITUTIONS vanilla has, and an army
; that garrisons every hold is exactly how news is supposed to cross a map.
;
; Measured on a 30-day in-game run before this list existed: 5 of 215 tellings
; crossed a hold boundary, and rung 6 -- the rung built to carry distant ties
; -- produced exactly one telling in the whole run. Only 13 admitted factions
; spanned more than one hold, against 96 denied ones that did; almost all of
; those 96 are correctly denied (JobMerchantFaction has 155 members across all
; ten holds, and two merchants in different holds are not acquaintances).
; These three are the exception.
;
;   GovSons      30 members,  8 holds   -- Stormcloaks
;   GovImperial  29 members,  8 holds   -- Imperial Legion
;   GovRuling    42 members,  8 holds   -- jarls, stewards and their courts
EditorID=GovSons
EditorID=GovImperial
EditorID=GovRuling

; An entry here overrides BOTH filters: the Deny fragments above AND the
; iGossipFactionSizeMin/Max bounds. Naming a faction outright is better
; evidence than a member count, so the size heuristic yields to it -- which is
; how GovRuling gets in at 42 members against a ceiling of 40.
;
; An entry that matches no faction is reported as a warning in
; NarrativeEngine.log at graph build. If you add one and see that warning,
; the EditorID is wrong or the mod defining it is not installed.
;
; Add entries here when a Deny fragment over-matches a faction that is
; genuinely a social group. For example, a mod
; faction called "RiverwoodTownsfolkGuild" would be caught by the `town`
; fragment; listing it here restores it:
;
;   EditorID=RiverwoodTownsfolkGuild
;
; For reference, these are the largest factions that survive the default
; filter on vanilla + DLC — a useful sanity check that your edits have not
; broken the list:
;
;   32  DLC2PillarBuilderFaction        12  DragonsreachOccupants
;   22  ThievesGuildFaction             10  MarkarthKeepFaction
;   18  CollegeofWinterholdFaction       9  RiftenMistveilKeepFaction
;   14  DarkBrotherhoodFaction           9  RiftenHaelgasBunkhouseFaction
;   14  DLC2SkaalVillageCitizenFaction   8  WhiterunMarketShoppers
;   13  CompanionsFaction                8  WindhelmMarketBrowsers
;
; And the ones that legitimately span more than one hold — the province-wide
; organisations that carry news across Skyrim:
;
;   DarkBrotherhoodFaction   4 holds    ThievesGuildFaction   2 holds
;   ThalmorFaction           4 holds    CWImperialFaction     2 holds
