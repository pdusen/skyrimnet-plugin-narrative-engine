set.mastermind_told_timed_out = {agent}から、{item}を仕上げる前に時間切れになったと報告があった。
set.mastermind_told_succeeded = {agent}から、{item}を作り上げたと報告があった。
fletch.agent_dispatched = {mastermind}から{item}をこしらえるよう頼まれ、作業に取りかかった。
