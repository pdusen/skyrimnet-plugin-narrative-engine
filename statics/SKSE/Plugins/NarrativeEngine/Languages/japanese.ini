smith.mastermind_told_failed = {agent}から、{item}の作業をしくじったと報告があった。
smith.mastermind_told_timed_out = {agent}から、{item}を仕上げる前に時間切れになったと報告があった。
smith.mastermind_told_succeeded = {agent}から、{item}を鍛え上げたと報告があった。
concoct.agent_dispatched = {mastermind}から{item}の調合を頼まれ、作業に取りかかった。
concoct.mastermind_dispatched = {scheme, phrase}という計画の一環として、{agent}に{item}の調合を頼んだ。
concoct.self_dispatched = {scheme, phrase}という計画の一環として、自ら{item}を調合する事にした。
