destroy.mastermind_told_timed_out = {agent}から、{mark}の{item}を破壊する前に時間切れになったと報告があった。
destroy.mastermind_told_succeeded = {agent}から、{mark}の{item}を破壊したと報告があった。
petition.agent_dispatched = {mastermind}から、代わりに{authority}に嘆願するよう頼まれ、引き受けて出発した。
petition.mastermind_dispatched = {scheme, phrase}という計画の一環として、私に代わって{authority}に嘆願するよう{agent}を送り出した。
petition.self_dispatched = {scheme, phrase}という計画の一環として、自ら{authority}に嘆願する事にした。
