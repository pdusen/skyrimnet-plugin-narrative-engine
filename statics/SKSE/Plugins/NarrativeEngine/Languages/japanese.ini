petition.mastermind_told_timed_out = {agent}から、{authority}に話を聞いてもらう前に時間切れになったと報告があった。
petition.mastermind_told_succeeded = {agent}から、{authority}が嘆願を聞き届けたと報告があった。
expose.agent_dispatched = {mastermind}から、{mark}に不利な証拠として{item}を{authority}に見せるよう頼まれ、引き受けて出発した。
expose.mastermind_dispatched = {scheme, phrase}という計画の一環として、{mark}に不利な証拠として{item}を{authority}に見せるよう{agent}を送り出した。
expose.self_dispatched = {scheme, phrase}という計画の一環として、自ら{mark}に不利な証拠として{item}を{authority}に見せる事にした。
expose.agent_succeeded = {item}を{authority}に見せると、{mark}に不利な証拠として受け入れられた。
expose.agent_failed = {item}を{authority}に見せたが、{mark}に不利な証拠とは認められなかった。
expose.agent_timed_out = {item}を{authority}に見せる前に時間切れになった。
expose.mastermind_told_failed = {agent}から、{authority}は{item}を{mark}に不利な証拠と認めなかったと報告があった。
