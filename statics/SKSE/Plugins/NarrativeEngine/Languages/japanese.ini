expose.mastermind_told_succeeded = {agent}から、{authority}が{item}を{mark}に不利な証拠と認めたと報告があった。
smith.agent_dispatched = {mastermind}から{item}の鍛造を頼まれ、鍛冶場で作業に取りかかった。
smith.mastermind_dispatched = {scheme, phrase}という計画の一環として、{agent}に{item}の鍛造を頼んだ。
smith.self_dispatched = {scheme, phrase}という計画の一環として、自ら{item}を鍛造する事にした。
