blackmail.mastermind_told_timed_out = {agent}から、{mark}を脅迫する前に時間切れになったと報告があった。
blackmail.mastermind_told_succeeded = {agent}から、{mark}が脅迫に屈したと報告があった。
destroy.agent_dispatched = {mastermind}から、{mark}の{item}を破壊するよう頼まれ、引き受けて出発した。
destroy.mastermind_dispatched = {scheme, phrase}という計画の一環として、{mark}の{item}を破壊するよう{agent}を送り出した。
destroy.self_dispatched = {scheme, phrase}という計画の一環として、自ら{mark}の{item}を破壊する事にした。
destroy.agent_succeeded = {mark}の{item}を破壊した。
destroy.agent_failed = {item}を破壊しようとしているところを{mark}に見つかった。
destroy.agent_timed_out = {mark}の{item}に手を出す前に時間切れになった。
