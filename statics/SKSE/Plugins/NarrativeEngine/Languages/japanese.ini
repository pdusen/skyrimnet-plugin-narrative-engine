concoct.agent_failed = {item}を調合している途中で、混ぜ物を台無しにしてしまった。
concoct.agent_timed_out = {item}の調合を終える前に時間切れになった。
concoct.mastermind_told_failed = {agent}から、{item}の調合を台無しにしたと報告があった。
concoct.mastermind_told_timed_out = {agent}から、{item}を仕上げる前に時間切れになったと報告があった。
concoct.mastermind_told_succeeded = {agent}から、{item}を調合したと報告があった。
enchant.agent_dispatched = {mastermind}から、アルケイン付呪器で{item}を作るよう頼まれ、作業に取りかかった。
enchant.mastermind_dispatched = {scheme, phrase}という計画の一環として、アルケイン付呪器で{item}を作るよう{agent}に頼んだ。
enchant.self_dispatched = {scheme, phrase}という計画の一環として、自らアルケイン付呪器で{item}を作る事にした。
