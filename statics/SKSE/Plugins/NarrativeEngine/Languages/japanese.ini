; ============================================================================
; NarrativeEngine — 日本語
; ============================================================================
;
; NarrativeEngineがプレイヤーに見せる文、または記憶やコセーブやゲームに
; 書き込む文は、すべてこのようなファイルから来る。言語ごとに1つずつあり、
; Skyrim自体の言語設定(sLanguage)にちなんで名付けられ、すべてUTF-8で書かれる。
;
; 英語が基準となる。他の言語のファイルに欠けているキーや誤りのあるキーは、
; キーごとに英語から取られ、どれがそうなったかはログに記される。
;
; 文言を変えるには
; ----------------
; 文を変えるためにこのファイルを編集してはならない。次のNarrativeEngineの
; 更新で置き換えられてしまう。変えたい行は隣のjapanese.custom.iniに、同じ
; セクションの下に書くこと。そちらがキーごとにこのファイルを上書きする。
; そのファイルは配布されないので、更新で触れられる事はない。
;
; テンプレート
; ------------
;   {agent}                                         値。人物ならその名前
;   {agent, select, female {...} male {...} other {...}}
;                                                   人物の性別で選ぶ
;   {days, plural, other {#日}}                     数で選ぶ(日本語は常にother)
;   {names, list}                                   [Grammar]に従って繋げたリスト
;   {scheme, phrase}                                文中に収まるよう整えた文
;
; これら以外の波括弧は誤りで、その行は英語に戻る。各キーはプラグインが
; そのキーに渡すプレースホルダーしか使えない。それ以外を使った行はログに
; 記される。
;
; コメントは独立した行に書くこと。値の後の';'は値の一部になる。

[Language]
Name = Japanese
NativeName = 日本語
Code = ja
Status = draft
PluralRule = none
Fonts = ja

; 値を二重引用符で囲むと、両端の空白が保たれる。
; 日本語は単語を空白で区切らないので、WordSeparated = false とする。
; 冠詞がないので、IndefiniteArticle と IndefiniteArticleBeforeVowel は空にし、
; [Plot.Item] は {article} を使わない。
[Grammar]
ListSeparator = 、
ListPairSeparator = と
ListFinalSeparator = と
CapitalizeSentenceStart = false
PhraseTrailingPunctuation = "。、！？.!?;,"
PhraseLowercaseFirst = false
WordSeparated = false
IndefiniteArticle =
IndefiniteArticleBeforeVowel =

; ============================================================================
; 陰謀
; ============================================================================
;
; 陰謀とは段階を踏んで実行される計画で、各段階(ステップ)は決まった動詞
; (見張る、盗む、告発する…)のどれか1つである。各動詞の文はそのIDごとに
; 下に並ぶ。使えるのは、ステップを実行する{agent}、計画の主である
; {mastermind}、計画そのものである{scheme}、そして動詞ごとの役({mark}、
; {item}、{place}…)。{scheme, phrase}は「〜という計画」の前に置かれる
; 普通形の動詞句で、「{scheme, phrase}という計画の一環として」となる。

; ダッシュボードでのステップの文と、そのノードの下の見出し。
[Plot.Dashboard]
watch.line = {agent}が{mark}を見張り、その習慣を探る。
watch.caption = 監視
ask_around.line = {agent}が{place}で{mark}について聞き込みをする。
ask_around.caption = 聞き込み
steal.line = {agent}が{mark}から{item}を盗む。
steal.caption = 窃盗
buy.line = {agent}が{seller}から{item}を買う。
buy.caption = 購入
deliver.line = {agent}が{item}を{recipient}に届ける。
deliver.caption = 配達
plant.line = {agent}が{mark}の持ち物に{item}を紛れ込ませる。
plant.caption = 仕込み
bribe.line = {agent}が{mark}に金を握らせ、見て見ぬふりをさせる。
bribe.caption = 買収
win_over.line = {agent}が{mark}を{mastermind}の味方に引き込む。
win_over.caption = 懐柔
threaten.line = {agent}が{mark}に、{mastermind}の事に首を突っ込むなと警告する。
threaten.caption = 脅し
spread_rumors.line = {agent}が{place}で{mark}の悪い噂を広める。
spread_rumors.caption = 噂の流布
denounce.line = {agent}が{mark}を{authority}に告発する。
denounce.caption = 告発
sabotage.line = {agent}が{mark}の生業を妨害する。
sabotage.caption = 妨害
silence.line = {agent}が{witness}に金を払って口止めする。
silence.caption = 口止め
falsify.line = {agent}が{subject}の名義で{item}を偽造する。
falsify.caption = 偽造
dig_up.line = {agent}が{mark}の悪事を裏付ける{item}を探し出す。
dig_up.caption = 証拠探し
blackmail.line = {agent}が{mark}を脅迫し、{mastermind}に従わせる。
blackmail.caption = 恐喝
destroy.line = {agent}が{mark}の{item}を破壊する。
destroy.caption = 破壊
petition.line = {agent}が{mastermind}に代わって{authority}に嘆願する。
petition.caption = 嘆願
expose.line = {agent}が{mark}に不利な証拠として{item}を{authority}に見せる。
expose.caption = 暴露
smith.line = {agent}が{item}を鍛造する。
smith.caption = 鍛冶
concoct.line = {agent}が{item}を調合する。
concoct.caption = 調合
enchant.line = {agent}がアルケイン付呪器で{item}を作る。
enchant.caption = 付呪
set.line = {agent}が細工台で{item}を作る。
set.caption = 宝飾細工
fletch.line = {agent}が{item}をこしらえる。
fletch.caption = 矢作り

; ステップが書く記憶。それを持つ者の声で書かれる:
;   agent_dispatched        実行者が、送り出された時
;   mastermind_dispatched   黒幕が、実行者を送り出した時
;   self_dispatched         自ら実行する事にした黒幕
;   agent_succeeded / agent_failed / agent_timed_out
