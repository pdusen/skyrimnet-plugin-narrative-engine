fletch.mastermind_told_succeeded = {agent}から、{item}をこしらえたと報告があった。

; ステップが及んだ人物がそれをどう覚えているか。動詞と役ごと:
;   failed      目の前でしくじった。実行者を見つけた
;   succeeded   自分に対して公然と行われた
;   noticed     ひそかに行われ、気づいた跡だけが残った。
;               だから誰の名も挙げない
[Plot.Remembered]
watch.mark.failed = {agent}が私を見張っているのに気づいた。
ask_around.mark.failed = {agent}が{place}で私の事を嗅ぎ回っていると耳にした。
steal.mark.failed = {agent}が私から{item}を盗もうとする現場を押さえた。
steal.mark.noticed = 誰かに{item}を盗まれた。
buy.seller.failed = {agent}が私から{item}を買おうとしたが、取引がこじれた。
buy.seller.succeeded = {agent}に{item}を売った。
deliver.recipient.failed = {agent}が{item}を届けに出発したはずだが、結局来なかった。
deliver.recipient.succeeded = {agent}が{item}を届けてくれた。
plant.mark.failed = {agent}が私の持ち物に{item}を紛れ込ませようとする現場を押さえた。
bribe.mark.failed = {agent}が見て見ぬふりをしろと金を差し出してきたが、断った。
bribe.mark.succeeded = {agent}から、見て見ぬふりをする代わりに金を受け取った。
win_over.mark.failed = {agent}が私を{mastermind}の味方に引き込もうとしたが、心は動かなかった。
win_over.mark.succeeded = {agent}に説得され、{mastermind}の味方についた。
threaten.mark.failed = {agent}に{mastermind}の事に首を突っ込むなと警告されたが、怯みはしなかった。
threaten.mark.succeeded = {agent}に{mastermind}の事に首を突っ込むなと警告され、肝に銘じた。
spread_rumors.mark.failed = {agent}が{place}で私の悪い噂を広めていると知った。
spread_rumors.mark.noticed = 誰かが{place}で私の悪い噂を広めている。
denounce.mark.succeeded = {agent}に{authority}へ告発された。
denounce.authority.failed = {agent}が{mark}を告発しに来たが、納得はできなかった。
denounce.authority.succeeded = {agent}が{mark}を告発しに来て、私はその話を信じた。
sabotage.mark.failed = {agent}が私の生業を妨害しようとする現場を押さえた。
sabotage.mark.noticed = 誰かが私の生業を妨害している。
silence.witness.failed = {agent}が口止めの金を差し出してきたが、断った。
silence.witness.succeeded = {agent}から口止め料を受け取った。
falsify.subject.failed = {agent}が私の名義で{item}を偽造しようとしたと知った。
dig_up.mark.failed = {agent}が私の身辺を探っていると知った。
blackmail.mark.failed = {agent}が私を脅して{mastermind}に従わせようとしたが、はったりを見抜いてやった。
blackmail.mark.succeeded = {agent}に脅され、{mastermind}に従う事になった。
destroy.mark.failed = {agent}が私の{item}を破壊しようとする現場を押さえた。
destroy.mark.noticed = 誰かに私の{item}を壊された。
petition.authority.failed = {agent}が{mastermind}に代わって嘆願してきたが、追い返した。
petition.authority.succeeded = {agent}が{mastermind}に代わって嘆願してきたので、聞き届けた。
expose.mark.succeeded = {agent}が私に不利な証拠として{item}を{authority}に見せた。
expose.authority.failed = {agent}が{mark}に不利な証拠として{item}を見せてきたが、納得はできなかった。
expose.authority.succeeded = {agent}が{mark}に不利な証拠として{item}を見せてきて、私は納得した。

; 陰謀についての黒幕の最後の記憶。went_onは、陰謀が別の道で続く時に
; 失敗したステップの記憶の後に付く。プラグインが取り除くのは英語の'.'
; だけなので、前の文の「。」は残る。だからwent_onは独立した文として書く。
[Plot.Outcome]
succeeded = {scheme, phrase}という計画をやり遂げた。
failed = {scheme, phrase}という計画は失敗に終わった。
conceded = {scheme, phrase}という計画をあきらめた。
went_on = だが、別の手で{scheme, phrase}という計画を続ける事にした。

; 誰も埋める前の役の読み方と、計画のない陰謀。schemeは「という計画」の
; 前に置かれるので、普通形の動詞句にする。
[Plot.Unfilled]
person = 誰か
place = どこか
thing = 何か
scheme = 目的を果たす

; 職人が作る品がステップでどう呼ばれるか。日本語には冠詞も複数形もないので、
; どちらも品の名前そのままとする。
[Plot.Item]
made = {name}
ammo = {name}

; 共同体の指導者の暴露を見せる相手が、人物ではなく共同体である時: その
; 集落、集落がなければ単に指導者が率いる人々。ステップの計画時に選ばれ、
; ステップと共に保存される。
[Plot.Audience]
led = その者が率いる人々
settlement = {settlement}の人々

; ============================================================================
; 噂
; ============================================================================

; 噂を聞いた者がそれをどう覚えているか、また語った者がそれを語った事。
; {band}は噂そのものの言葉で、1文の事も数文の事もある。だから前置きはどれも
; 「：」で終える。{kin}はゲーム自体の語り手の続柄(「姉」など)。{hold}は
; 語り手がやって来た所、または unknown.hold。
[Gossip.Memory]
heard.kin_from_away = {hold}から来た{kin}が、こんな知らせを持ってきた：{band}
heard.kin = {kin}の{teller}がこんな話をしてくれた：{band}
heard.household = 夕食の席で{teller}がこんな話をした：{band}
heard.settlement = {teller}からこんな話を聞いた：{band}
heard.rumor = こんな噂が広まっているのを耳にした：{band}
told = {listeners, list}にこんな話をした：{band}
unknown.person = 誰か
unknown.hold = 遠方

; ============================================================================
; 手紙
; ============================================================================

; 手紙を送った書き手の記憶。続けてその手紙を引用する。
[Letter.Memory]
sent = <<<END
{recipient}に手紙を書いて送った。内容は次の通りだ：

{body}
END
unknown.recipient = 受取人

; ============================================================================
; 訪問
; ============================================================================

; 訪問が終わる時、再開する時、途中で立ち去られた時にSkyrimNetが記録し、
; それをもとに語るナレーション。{visitor}は訪ねて来たNPC、{player}は
; プレイヤー。
[Visit.Narration]
walked_out = {player}は{visitor}との会話の途中で、突然立ち去った。
valediction = 言うべき事を言い終え、{visitor}は立ち去る支度をする。
valediction.ignored = 話を続けられず、相手にされなかった事に苛立ちながら、{visitor}は立ち去る支度をする。
reengage = 邪魔が去ったので、{visitor}は{player}に向き直り、中断したところから話を再開しようとする。
unknown.player.opening = プレイヤー
unknown.player = プレイヤー
unknown.visitor = 訪問者
unknown.sender = 差出人

; 手紙自体の題名がないか長すぎる時の代わりの題名。本の題名は24文字まで
; なので、題名全体が収まるまで差出人の名前が短くされる。item_cardは
; 所持品画面で手紙の名前の下に出る行。
[Letter]
fallback_title = {sender}からの手紙
item_card = 封をされた手紙。

; ============================================================================
; 出来事の記録
; ============================================================================

; ダッシュボードの出来事の一覧と出来事の履歴ログが、プレイヤーの周りで
; 起きている事をどう書くか。ディレクターも同じ出来事を読むが、そのための
; 文言はプロンプト自身が持つ。ログは常に英語で書かれる。

; 一覧の1項目: {age}はどれほど前か、{body}は何が起きたか。
[Event]
line = [{age}] {body}
idle = {duration}の間、特に何も起きていない
idle_long = 1時間以上、特に何も起きていない

; どれほど前に起きたか。最も大きい単位の整数で。
[Event.Age]
moment = たった今
minute = {n, plural, other {#分前}}
hour = {n, plural, other {#時間前}}
day = {n, plural, other {#日前}}
week = {n, plural, other {#週間前}}
unknown = 最近

; 何かがどれほど続いているか。「5分の間」のように使う。
[Event.Duration]
moment = 1分足らず
minute = {n, plural, other {#分}}
hour = {n, plural, other {#時間}}
day = {n, plural, other {#日}}
week = {n, plural, other {#週間}}

; SkyrimNet自体の出来事。".to"の行は特定の誰かに向けて言ったもの。
; with_textは本の行に続けてその本の内容を書く。
[Event.SkyrimNet]
dialogue = {speaker}「{dialogue}」
dialogue.to = {speaker} -> {listener}「{dialogue}」
player_dialogue = (プレイヤー) {speaker}「{dialogue}」
player_dialogue.to = (プレイヤー) {speaker} -> {listener}「{dialogue}」
gamemaster_dialogue = {speaker} -> {target} (話題: {topic}): {dialogue}
npc_thoughts = {name} (心の声)「{thoughts}」
death = {killer}が{victim}を殺した
book_read = {reader}が『{title}』を読んだ
book_read.untitled = {reader}が本を読んだ
book_read.with_text = <<<END
{line}:
{body}
END
unknown.reader = プレイヤー
no_data = (データなし)

; プレイヤーの近くでの戦い。続けざまの攻撃は1行にまとめられる: 各組の戦い、
; 次に誰からでもない傷が、joinで繋げられる。"several"は複数の戦いのまとめを
; 始め、"others"は一部を省いたまとめを締める。{source}は傷を与えたもの:
; source.*の行、またはそれをしたものの名前。
[Event.Combat]
combat_start = {actor}が戦闘に入った
combat_end = {actor}が戦闘から離れた
collapse = {actor}が倒れた
regain_footing = {actor}が体勢を立て直した
strike = {actor}が{target}に一撃を加えた
attack = {actor}が{target}を攻撃した
trade = {actor}と{target}が打ち合った
damage = {target}がダメージを受けた
damage.from = {target}が{source}からダメージを受けた
damage.repeated = {target}が繰り返しダメージを受けた
damage.repeated.from = {target}が{source}から繰り返しダメージを受けた
source.poison = 毒
source.spell_trap = 魔法の罠
source.trap = 罠
several = 戦闘が続いている：{fights}
others = {fights}、ほか
join = {first}、{then}

; プレイヤーが気づくような天気の変化。
[Event.Weather]
blizzard_start = 吹雪になった。
storm_intensify = 風が強まり、嵐が激しくなっている。
storm_subside = 嵐が収まりつつある。
weather_shift = 天気が変わった。
storm_start = 雷雨が近づいている。
rain_start = 雨が降り始めた。
snow_start = 雪が降り始めた。
rain_stop = 雨がやんだ。
snow_stop = 雪が小降りになってきた。
clear_start = 雲が切れ、日が差してきた。
cloudy_start = 空が曇ってきた。

; プレイヤーと同行者がどこへ行ったか。{party}はプレイヤーとその従者達、
; {count}はその人数。".interior"の行は屋外の場所ではなく建物かダンジョン。
