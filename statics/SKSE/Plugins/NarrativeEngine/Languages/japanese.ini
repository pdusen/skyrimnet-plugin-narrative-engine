; ============================================================================
; 照合
; ============================================================================

; モデルが欄をどんな形で書くべきか。英語のプロンプトに差し込まれるので
; 英語で書く。schemeは「という計画」の前に置かれる普通形の動詞句で、下の
; Schemeの照合はまさにその形を求める。
[Prompt.Form]
scheme = a Japanese verb phrase with no stated subject that ends in the plain (dictionary) form of its verb, never in a polite (ます/です) or past (た/だ) ending, so that it reads naturally before "という計画" ("the plan to ..."), e.g. "仲買人の書斎から王者のアミュレットを盗む" or "ジェイ・ザルゴをトルフディルのお気に入りの弟子の座から引きずり下ろす"

; この言語で、プラグインが名前とモデルの書いた文をどう読むか。
;
; 照合は、文のどこを見るかで名付けたリストとして書く:
;   <Check>.Reject.Start / .Reject.End     文はこう始まって / 終わってはならない
;   <Check>.Require.Start / .Require.End   文はこう始まらねば / 終わらねばならない
;   <Check>.Match.Start / .End / .Anywhere そこで見つかれば反応する検出器
;   <Check>.Disabled = <理由>              この言語ではその照合を行わない
; 各リストはカンマ区切り。日本語は WordSeparated = false なので、各項目は
; 文字の並びとしてその位置で照合され(文の両端の空白と句読点は除く)、*は
; 任意の文字列を表す。大文字小文字は区別しない。言語のファイルは、どの照合
; にも規則を与えるか、ない理由を書く。何も書かない照合は英語から取られない。
;
; Scheme: 計画は陰謀が書くすべての記憶で「〜という計画」の前に引用される
; ので、普通形の動詞で終わらねばならない(う段の音: 盗む、行く、する)。
; 「ます」「です」や過去形「た」「だ」、「ましょう」「でしょう」「だろう」で
; 終わるもの、「彼は」「私は」のように主語で始まるものは崩れた計画の印。
; 「励ます」「覚ます」のような、本来「ます」で終わる動詞も拒まれてしまうが、
; 計画の文には稀なので受け入れる。
;
; PlayerTitle: モデルがプレイヤーを指す時の呼び名。Skyrimのどの NPC も
; その名を持たない。ミラークはミラークのままである。
;
; Ghost: ゲームの亡霊フラグが見逃した幽体は、名前でそれと分かる
; (「ダンマーの亡霊」「冒険者の亡霊」)。
;
; 単純なリスト:
; Name.Suffixes: 文中で人名の後に付いても同じ人を指す助詞(「リディアの」)。
; 日本語では名前は文字の並びとして文中のどこでも探されるので、これは
; 説明のためのリストに近い。
; Name.Titles: 名前に付く肩書きで、多くの人が持つため誰とも決められないもの。
; 「隊長」だけではどの隊長でもない。
; Item.Articles: 品の名前の頭に付きうる語。日本語には冠詞がなく、[Plot.Item]
; も名前そのままなので空。
; Title.Strip.Start: 手紙の代わりの題名が差出人の名前の頭から外してよい
; 肩書き。プラグインは肩書きの後に空白がある時だけ外す。ゲームは「首長
; <名前>」とだけ空白を入れて書く。Title.Strip.After: 異名の前に来る語。
; 日本語の異名は名前の前に付く(「偉大なるバルグルーフ」)ので空。
[Matching]
