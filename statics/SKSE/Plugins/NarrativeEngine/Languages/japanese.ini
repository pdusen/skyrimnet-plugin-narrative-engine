enchant.mastermind_told_timed_out = {agent}から、{item}を仕上げる前に時間切れになったと報告があった。
enchant.mastermind_told_succeeded = {agent}から、{item}を作り上げたと報告があった。
set.agent_dispatched = {mastermind}から{item}を作るよう頼まれ、自分の細工台で作業に取りかかった。
set.mastermind_dispatched = {scheme, phrase}という計画の一環として、{item}を作るよう{agent}に頼んだ。
set.self_dispatched = {scheme, phrase}という計画の一環として、自ら{item}を作る事にした。
