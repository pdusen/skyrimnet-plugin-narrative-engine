; Plan wstawiany jest w środek zdania jako "w ramach mojego planu, by
; {scheme, phrase}", więc musi być zdaniem bezokolicznikowym bez podmiotu.
; To polecenie trafia do angielskiego promptu, więc jest po angielsku.
[Prompt.Form]
scheme = a bare Polish infinitive clause that opens with its verb, with no subject and no leading "żeby", "by" or "aby" (a reflexive "się" after the verb is fine), e.g. "ukraść Amulet Królów z gabinetu Pośrednika" or "pozbawić J'zargo pozycji ulubionego ucznia Tolfdira"

; ============================================================================
; Dopasowywanie
; ============================================================================

; Jak wtyczka czyta imiona i to, co pisze model, w tym języku.
;
; Sprawdzenie zapisuje się jako listy według miejsca, w którym patrzą:
;   <Check>.Reject.Start / .Reject.End     tekst nie może się tak zaczynać / kończyć
;   <Check>.Require.Start / .Require.End   tekst musi się tak zaczynać / kończyć
;   <Check>.Match.Start / .End / .Anywhere wykrywacz, znaleziony tam
;   <Check>.Disabled = <powód>             sprawdzenie wyłączone w tym języku
; Każda lista jest rozdzielona przecinkami. Pozycja to słowa rozdzielone
; spacjami, a * w słowie oznacza dowolne litery: "* jest" to dowolne słowo, po
; którym stoi "jest", a "smocz*" pasuje do "Smoczego". Wielkość liter nie ma
; znaczenia. Plik języka daje każdemu sprawdzeniu reguły albo mówi, czemu ich
; nie ma; sprawdzenie, o którym milczy, nie jest brane z angielskiego.
;
; Scheme: plan jest cytowany w "w ramach mojego planu, by ...", więc musi być
; zdaniem bezokolicznikowym. Pierwsze słowo musi więc być bezokolicznikiem
; (na -ć albo jednym z bezokoliczników na -c), ewentualnie po "nie". Rzeczownik
; na -ość czy "śmierć" na początku zdradza frazę rzeczownikową zamiast polecenia.
;
; PlayerTitle: jak model nazywa gracza, gdy ma go na myśli. Żaden NPC w Skyrim
; tak się nie nazywa.
;
; Ghost: zjawa, której gra nie oznaczyła flagą ducha, mówi o tym w nazwie;
; polska wersja stawia "Duch" na początku ("Duch Dunmera"), czasem na końcu.
;
; Proste listy:
; Name.Suffixes: końcówki przypadków, z którymi imię w tekście nadal oznacza
; tę osobę ("Tolfdira", "Tolfdirowi", "Octieve'a").
; Name.Titles: tytuły, od których zaczyna się imię, zbyt wielu osób, by
; wskazać kogoś konkretnego: sam "kapitan" to żaden konkretny kapitan.
; Item.Articles: czym może zaczynać się nazwa rzeczy, czego tekst o tej rzeczy
; nie musi powtarzać. [Plot.Item] zapisuje nazwy, które tak się zaczynają.
; Title.Strip.Start: tytuły, które zastępczy tytuł listu może zdjąć z przodu
; imienia nadawcy. Title.Strip.After: słowa, po których stoi przydomek; polski
; ich nie ma ("Balgruuf Większy"), więc lista jest pusta.
[Matching]
