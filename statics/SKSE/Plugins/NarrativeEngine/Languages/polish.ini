; otwiera streszczenie kilku walk; "others" zamyka takie, które coś pominęło.
; {source} to, co zadało obrażenia: linia source.* albo nazwa sprawcy.
[Event.Combat]
combat_start = {actor} wchodzi do walki
combat_end = {actor} wychodzi z walki
collapse = {actor} osuwa się na ziemię
regain_footing = {actor} odzyskuje równowagę
strike = {actor} zadaje cios; cel: {target}
attack = {actor} atakuje; cel: {target}
trade = {actor} i {target} wymieniają ciosy
damage = {target} odnosi obrażenia
