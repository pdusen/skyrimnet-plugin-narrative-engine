; Dokąd poszli gracz i ci, którzy z nim podróżują. {party} to gracz i jego
; towarzysze, {count} ich liczba (od niej zależy liczba czasownika). Linia
; ".interior" to budynek lub loch, a nie miejsce pod gołym niebem; ".nowhere"
; to wypadek, gdy nie wiadomo, skąd przyszli. journey i visit streszczają
; serię bliskich sobie ruchów. Nazwy miejsc stoją po dwukropku, w mianowniku.
[Event.Travel]
entered_location = {party, list} {count, plural, one {dociera} few {docierają} many {docierają} other {docierają}} na miejsce: {place}.
