; ============================================================================
; NarrativeEngine — Polski
; ============================================================================
;
; Każde zdanie, które NarrativeEngine pokazuje graczowi albo zapisuje we
; wspomnieniu, w co-save lub w grze, pochodzi z pliku takiego jak ten: jeden
; na język, nazwany według ustawienia języka samego Skyrima (sLanguage),
; wszystkie w UTF-8.
;
; Wzorcem jest angielski. Każdy klucz, którego tu brakuje albo który jest
; błędny, zostaje wzięty z angielskiego, pojedynczo, a dziennik podaje który.
;
; Zmiana tekstów
; --------------
; Nie zmieniaj tego pliku: następna aktualizacja NarrativeEngine go zastąpi.
; Wpisz zmieniane linie do pliku polish.custom.ini obok, w tej samej sekcji;
; nadpisują one te klucze pojedynczo. Tamten plik nigdy nie jest dostarczany,
; więc aktualizacje go nie ruszają.
;
; Szablony
; --------
;   {agent}                                         wartość; u osoby jej imię
;   {agent, select, female {...} male {...} other {...}}
;                                                   według płci osoby
;   {days, plural, one {# dzień} few {# dni} many {# dni} other {# dnia}}
;                                                   według liczby
;   {names, list}                                   lista, łączona jak w [Grammar]
;   {scheme, phrase}                                tekst przycięty do środka zdania
;
; Nawias klamrowy spoza tych form to błąd i linia wraca do angielskiego.
; Każdy klucz przyjmuje tylko symbole, które daje mu wtyczka; dziennik
; wymienia każdą linię, która używa innego.
;
; Imiona się w polszczyźnie odmieniają, a szablon tego nie potrafi, więc
; imiona stoją tu w mianowniku: jako podmiot ("{mark} przymknął oko"), po
; dwukropku albo po rzeczowniku, który przejmuje przypadek ("w okolicy
; miejsca {place}"), tak jak robi to polska wersja gry. Czasowniki w czasie
; przeszłym zgadzają się z płcią osoby przez select; "other" to forma męska.
;
; Komentarz musi stać w osobnej linii. Znak ';' po wartości należy do niej.

[Language]
Name = Polish
NativeName = Polski
Code = pl
Status = draft
PluralRule = polish
Fonts = pl, ru

; Cudzysłów wokół wartości zachowuje spacje na jej końcach.
[Grammar]
ListSeparator = ", "
ListPairSeparator = " i "
ListFinalSeparator = " i "
CapitalizeSentenceStart = true
PhraseTrailingPunctuation = ".!?;,"
PhraseLowercaseFirst = true
; Polski nie ma rodzajników, więc oba pola zostają puste, a [Plot.Item]
; obywa się bez {article}.
IndefiniteArticle =
IndefiniteArticleBeforeVowel =

; ============================================================================
; Intrygi
; ============================================================================
;
; Intryga to plan wykonywany krokami, a każdy krok to jeden z ustalonych
; czasowników (obserwować, ukraść, donieść...). Zdania każdego czasownika są
; poniżej, pod jego identyfikatorem. Mogą wymieniać {agent}, wykonawcę kroku;
; {mastermind}, autora intrygi; {scheme}, sam plan; oraz własne miejsca
; czasownika ({mark}, {item}, {place}, ...). {scheme, phrase} przycina plan
; do środka zdania: "w ramach mojego planu, by {scheme, phrase}." Plan jest
; więc zdaniem bezokolicznikowym (zob. [Prompt.Form]).

; Zdanie panelu dla kroku i podpis pod jego węzłem.
