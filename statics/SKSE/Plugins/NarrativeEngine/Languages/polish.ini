journey = {party, list} {count, plural, one {odbywa} few {odbywają} many {odbywają} other {odbywają}} podróż (skąd: {origin}, dokąd: {arrival}).
journey.to = {party, list} {count, plural, one {trafia} few {trafiają} many {trafiają} other {trafiają}} w końcu na miejsce: {arrival}.
journey.from = {party, list} {count, plural, one {wyrusza} few {wyruszają} many {wyruszają} other {wyruszają}} w drogę (skąd: {origin}).
