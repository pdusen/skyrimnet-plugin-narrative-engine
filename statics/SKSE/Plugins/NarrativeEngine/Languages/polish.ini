crossed_holds = {party, list} {count, plural, one {przekracza} few {przekraczają} many {przekraczają} other {przekraczają}} granicę krain (skąd: {from}, dokąd: {to}).
entered_wilderness = {party, list} {count, plural, one {opuszcza} few {opuszczają} many {opuszczają} other {opuszczają}} miejsce: {origin}, i {count, plural, one {jest} few {są} many {są} other {są}} teraz na pustkowiach (kraina: {hold}).
entered_wilderness.exited = {party, list} {count, plural, one {opuszcza} few {opuszczają} many {opuszczają} other {opuszczają}} wnętrze: {origin}, i {count, plural, one {jest} few {są} many {są} other {są}} teraz na pustkowiach (kraina: {hold}).
fast_travel_arrived = {party, list} {count, plural, one {dociera} few {docierają} many {docierają} other {docierają}} na miejsce: {place}, po podróży (skąd: {origin}).
fast_travel_arrived.interior = {party, list} {count, plural, one {wchodzi} few {wchodzą} many {wchodzą} other {wchodzą}} do środka: {place}, po podróży (skąd: {origin}).
fast_travel_arrived.nowhere = {party, list} {count, plural, one {dociera} few {docierają} many {docierają} other {docierają}} na miejsce: {place}.
