; ============================================================================
; Tramas sembradas para pruebas
; ============================================================================

; Las dos tramas de prueba que puede sembrar el panel, y la trama de
; depuración sembrada a mano. Se guardan y se recuerdan como cualquier otra
; trama, así que también van en cada idioma.
[Plot.Test]
brelyna.ambition = Ser conocida como la aprendiz más prometedora del Colegio.
brelyna.scheme = Hacer que J'zargo pierda su puesto de aprendiz favorito de Tolfdir.
brelyna.finish = Denunciar a J'zargo ante Mirabelle Ervine.
tolfdir.ambition = Proteger el Colegio de quienes quieran usarlo para sus propios fines.
tolfdir.scheme = Demostrar a Savos Aren que Ancano ha estado husmeando en los secretos del Colegio.
tolfdir.finish = Mostrar a Savos Aren las pruebas contra Ancano.
college = el Colegio de Hibernalia
journal = un diario privado
debug.mastermind = Cerebro de depuración
debug.ambition = Una trama sembrada a mano, provisional hasta que exista el nacimiento de tramas.
debug.scheme = Sacar el Amuleto de reyes de las manos del Intermediario y ponerlo en las suyas.
debug.step.locate = Averiguar en cuál de las estancias del Intermediario se guarda el amuleto.
debug.step.surveil = Vigilar la finca hasta conocer bien la rutina nocturna de la casa.
debug.step.acquire = Llevarse el amuleto durante la hora en que el estudio queda vacío.

; ============================================================================
; El registro de decisiones del Director
; ============================================================================

; Cómo se lee en el panel, y en el propio historial del Director, una decisión
; que salió mal. {detail} es de qué trataba, tal como llegó: el id de una
; escena, la respuesta del modelo o por qué se rechazó su elección.
[Decision]
failed = (error: {reason})
reason.beat_missing = La escena '{detail}' elegida por el LLM no está en el registro
reason.llm_error = Error del LLM: {detail}
reason.not_json = La respuesta del LLM no era un objeto JSON: {detail}
reason.not_offered = El LLM eligió en cada intento una opción que no se le ofrecía (última: {detail})
note.invalid_json = error de análisis: JSON no válido
note.not_an_object = error de análisis: la respuesta no era un objeto JSON
note.forced_dispatch = envío forzado desde la interfaz de depuración

; ============================================================================
; El panel
; ============================================================================

; Todo el texto del panel del juego. A diferencia de las secciones de arriba,
; estas claves las declara el propio archivo inglés: cada una admite los
; marcadores que usa su línea inglesa, un número donde dice {n, plural, ...} y
; texto en los demás casos.
;
; <b>...</b>, <strong>...</strong> e <i>...</i> marcan el énfasis en las
; líneas que lo usan, para que el énfasis pueda moverse con las palabras.
[Dashboard]
