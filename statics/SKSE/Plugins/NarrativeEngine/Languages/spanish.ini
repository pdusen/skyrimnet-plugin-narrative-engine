; ============================================================================
; NarrativeEngine — Español
; ============================================================================
;
; Cada frase que NarrativeEngine muestra al jugador, o que escribe en un
; recuerdo, en el co-save o en el juego, sale de un archivo como este: uno por
; idioma, con el nombre del idioma del propio juego (sLanguage), todos en UTF-8.
;
; El inglés es la referencia. Cualquier clave que falte en este archivo, o que
; esté mal, se toma de english.ini, clave a clave, y el registro dice cuál.
;
; Cambiar el texto
; ----------------
; No edites este archivo para cambiar una frase: la próxima actualización de
; NarrativeEngine lo sustituye. Pon las líneas que quieras cambiar en
; spanish.custom.ini, junto a este, bajo la misma sección, y sustituirán a
; estas clave a clave. Ese archivo nunca se distribuye, así que las
; actualizaciones no lo tocan.
;
; Plantillas
; ----------
;   {agent}                                         un valor; el nombre de una persona
;   {agent, select, female {...} male {...} other {...}}
;                                                   según el sexo de una persona
;   {days, plural, one {# día} other {# días}}      según un número
;   {names, list}                                   una lista, unida según [Grammar]
;   {scheme, phrase}                                texto ajustado para ir en mitad de una frase
;
; Una llave que no forme parte de una de estas es un error, y la línea vuelve
; al inglés. Cada clave admite solo los marcadores que el plugin le da; el
; registro indica cualquier línea que use otro.
;
; Los comentarios van en su propia línea. Un ';' después de un valor forma
; parte de él.

[Language]
Name = Spanish
NativeName = Español
Code = es
Status = draft
PluralRule = spanish
Fonts = en, pl, ru, ja, cn

; Pon un valor entre comillas dobles para conservar los espacios de sus extremos.
[Grammar]
ListSeparator = ", "
ListPairSeparator = " y "
ListFinalSeparator = " y "
CapitalizeSentenceStart = true
PhraseTrailingPunctuation = ".!?;,"
PhraseLowercaseFirst = true
; El artículo del inglés (a/an) ante el nombre de un objeto fabricado. En
; español el artículo depende del género del nombre, así que ambos quedan
; vacíos y [Plot.Item] no usa {article}.
IndefiniteArticle =
IndefiniteArticleBeforeVowel =

; ============================================================================
; Tramas
; ============================================================================
;
; Una trama es un plan llevado a cabo en pasos, y cada paso es uno de un
; conjunto fijo de verbos (vigilar, robar, denunciar...). Las frases de cada
; verbo van bajo su id. Pueden nombrar a {agent}, quien realiza el paso;
; {mastermind}, el cerebro de la trama; {scheme}, el plan en sí; y los huecos
; propios del verbo ({mark}, {item}, {place}...). {scheme, phrase} ajusta el
; plan para ir en mitad de una frase: "mi plan para {scheme, phrase}".

; La frase del panel para un paso, y el rótulo bajo su nodo.
[Plot.Dashboard]
