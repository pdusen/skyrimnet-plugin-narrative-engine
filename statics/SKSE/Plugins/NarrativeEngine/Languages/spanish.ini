; ============================================================================
; Plantillas de contenido
; ============================================================================

; Qué forma debe tener cada campo que el modelo escribe en este idioma, para
; que encaje en las plantillas de arriba. Va en inglés porque se inserta en un
; prompt en inglés. Se edita junto con la comprobación Scheme de [Matching].
[Prompt.Form]
scheme = an infinitive clause opening with a bare Spanish infinitive (no subject, article, "para" or conjugated verb before it), e.g. "robar el Amuleto de reyes"

; ============================================================================
; Coincidencias
; ============================================================================

; Cómo lee el plugin los nombres y lo que escribe el modelo, en este idioma.
;
; Una comprobación se escribe como listas, según dónde miran en el texto:
;   <Check>.Reject.Start / .Reject.End     el texto no debe empezar / terminar así
;   <Check>.Require.Start / .Require.End   el texto debe empezar / terminar así
;   <Check>.Match.Start / .End / .Anywhere un detector, encontrado ahí
;   <Check>.Disabled = <motivo>            la comprobación está desactivada
; Cada lista va separada por comas. Una entrada son palabras separadas por
; espacios, y * en una palabra equivale a cualquier letra: "* quiere" es
; cualquier palabra seguida de "quiere", y "*arse" encaja con "hacerse". Las
; mayúsculas nunca importan. Cada comprobación lleva reglas o dice por qué no
; las tiene; una de la que no se dice nada no se toma del inglés.
;
; Scheme: el plan va dentro de "mi plan para ..." en todos los recuerdos de una
; trama, así que debe empezar por un infinitivo. Se rechaza lo que empieza por
; un pronombre, un artículo, "que", "para" o "a", o por un nombre seguido de un
; verbo conjugado; y se exige que la primera palabra tenga forma de infinitivo,
; con o sin pronombre enclítico.
;
; PlayerTitle: cómo llama el modelo al jugador cuando se refiere a él.
;
; Ghost: una aparición que la marca de fantasma del juego no detecta lo dice en
; su nombre, al principio ("Fantasma de Helgi") o al final ("Aventurero
; fantasma").
;
; Listas simples:
; Name.Suffixes: terminaciones que el nombre de una persona puede llevar en un
; texto sin dejar de ser ella. El español no tiene ninguna.
; Name.Titles: tratamientos con que empieza un nombre, demasiado comunes para
; saber a quién se refiere un texto: "Capitán" a secas no es ningún capitán.
; Item.Articles: con qué puede empezar el nombre de un objeto que escribe
; [Plot.Item], y que un texto que lo nombre no necesita repetir.
; Title.Strip.Start: títulos que el título de reserva de una carta puede quitar
; del principio del nombre del remitente. Title.Strip.After: las palabras que
; preceden a un epíteto, para que "Balgruuf el Grande" quede en "Balgruuf".
[Matching]
