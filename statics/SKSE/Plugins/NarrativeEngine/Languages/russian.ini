; Последнее воспоминание автора о его замысле. went_on завершает
; воспоминание о сорвавшемся шаге, когда интрига идет дальше другим путем, и
; поэтому начинается с середины фразы. Пол автора эти ключи не знают, поэтому
; фразы безличные ("мне удалось").
[Plot.Outcome]
succeeded = Мой замысел осуществился: мне удалось {scheme, phrase}.
failed = Мой план провалился: мне так и не удалось {scheme, phrase}.
conceded = Мне пришлось оставить свой замысел: {scheme, phrase}.
went_on = , но нашелся другой способ довести до конца мой план: {scheme, phrase}.

; Как звучит место, пока его никто не занял, и интрига без замысла. Место
; стоит в "в окрестностях места {place}", а замысел — после "мне удалось",
; поэтому замысел — инфинитив.
[Plot.Unfilled]
person = кто-то
place = без названия
thing = что-то
scheme = добиться своего

; Как называется в шаге вещь, которую делает мастер. Артиклей в русском нет,
; а название боеприпаса здесь не просклонять, поэтому колчан стоит перед
; названием через тире; [Matching] Item.Articles знает это начало.
[Plot.Item]
made = {name}
ammo = колчан — {name}

; Кому показывают доказательство против вожака общины, когда это сама
; община, а не человек: ее поселение или, если его нет, просто те, кем вожак
; правит. Стоит на месте персонажа, в именительном падеже, с глаголом в
; мужском роде, поэтому это собирательное существительное в единственном числе.
[Plot.Audience]
led = подвластный народ
settlement = народ поселения {settlement}

; ============================================================================
; Слухи
; ============================================================================

; Как слушатель помнит услышанный слух, а рассказчик — что его пересказал.
; {band} — слова самого слуха, одна фраза или несколько, поэтому каждое
; вступление кончается двоеточием. {kin} — игровое слово для рассказчика
; ("сестра"); {hold} — откуда он пришел, или unknown.hold. Пол того, кто
; помнит, здесь неизвестен, поэтому фразы о нем безличные.
[Gossip.Memory]
heard.kin_from_away = {teller, select, female {Моя} other {Мой}} {kin} {teller, select, female {вернулась} other {вернулся}} из дальних краев ({hold}) с вестями: {band}
heard.kin = {teller, select, female {Моя} other {Мой}} {kin} {teller} {teller, select, female {рассказала} other {рассказал}} мне вот что: {band}
heard.household = {teller} {teller, select, female {упомянула} other {упомянул}} за ужином вот что: {band}
heard.settlement = {teller} {teller, select, female {рассказала} other {рассказал}} мне вот что: {band}
heard.rumor = До меня дошел слух: {band}
told = Мне довелось пересказать эту весть (кому: {listeners, list}): {band}
unknown.person = кто-то
unknown.hold = откуда — неизвестно

; ============================================================================
; Письма
; ============================================================================

; Воспоминание автора об отправленном письме, которое затем его цитирует.
[Letter.Memory]
sent = <<<END
Мое письмо написано и отправлено. Адресат: {recipient}. Вот что в нем говорилось:

{body}
END
unknown.recipient = неизвестен

; ============================================================================
; Визиты
; ============================================================================

; Повествование, которое SkyrimNet записывает и озвучивает, когда визит
; заканчивается, возобновляется или прерывается уходом. {visitor} — NPC,
; который пришел; {player} — игрок.
[Visit.Narration]
walked_out = {player} внезапно {player, select, female {ушла} other {ушел}} посреди разговора, и {visitor} {visitor, select, female {осталась} other {остался}} без собеседника.
valediction = Сказав все, что нужно было сказать, {visitor} собирается уходить.
valediction.ignored = Так и не сумев поддержать разговор, {visitor} собирается уходить, {visitor, select, female {раздосадованная тем, что ее} other {раздосадованный тем, что его}} не замечают.
reengage = Помеха осталась позади: {player} и {visitor} снова могут говорить, и {visitor} пытается продолжить разговор с того места, где он прервался.
unknown.player.opening = Игрок
unknown.player = игрок
unknown.visitor = гость
unknown.sender = отправитель

; Как звучит запасное название письма, когда его собственного названия нет
; или оно слишком длинное: название книги вмещает 24 знака, поэтому имя
; отправителя укорачивается, пока все не поместится. Двоеточие оставляет имя
; в именительном падеже. Карточка предмета — строка под названием письма в
; инвентаре.
[Letter]
fallback_title = Письмо от: {sender}
item_card = Запечатанное письмо.

; ============================================================================
; Лента событий
; ============================================================================

; Как список событий на панели и журнал истории событий описывают то, что
; происходит вокруг игрока. Режиссер читает те же события, но его промпты
; описывают их по-своему. Журнал всегда ведется по-английски; панель
; показывает эти строки.

; Одна запись списка: {age} — как давно, {body} — что случилось.
[Event]
line = [{age}] {body}
idle = За {duration} не произошло ничего примечательного
idle_long = Больше часа не происходит ничего примечательного

; Как давно что-то случилось, в самой крупной целой единице.
[Event.Age]
moment = только что
minute = {n, plural, one {# минуту назад} few {# минуты назад} many {# минут назад} other {# минуты назад}}
hour = {n, plural, one {# час назад} few {# часа назад} many {# часов назад} other {# часа назад}}
day = {n, plural, one {# день назад} few {# дня назад} many {# дней назад} other {# дня назад}}
week = {n, plural, one {# неделю назад} few {# недели назад} many {# недель назад} other {# недели назад}}
unknown = недавно

; Как долго что-то длится, в винительном падеже, как в "за 5 минут".
[Event.Duration]
moment = неполную минуту
minute = {n, plural, one {# минуту} few {# минуты} many {# минут} other {# минуты}}
hour = {n, plural, one {# час} few {# часа} many {# часов} other {# часа}}
day = {n, plural, one {# день} few {# дня} many {# дней} other {# дня}}
week = {n, plural, one {# неделю} few {# недели} many {# недель} other {# недели}}

; Собственные события SkyrimNet. Строка ".to" сказана кому-то определенному.
; with_text дополняет строку о книге ее текстом.
[Event.SkyrimNet]
dialogue = {speaker}: «{dialogue}»
dialogue.to = {speaker} -> {listener}: «{dialogue}»
player_dialogue = (игрок) {speaker}: «{dialogue}»
player_dialogue.to = (игрок) {speaker} -> {listener}: «{dialogue}»
gamemaster_dialogue = {speaker} -> {target} (тема: {topic}): {dialogue}
npc_thoughts = {name} (думает): «{thoughts}»
death = {victim} погибает; убийца: {killer}
book_read = {reader} читает «{title}»
book_read.untitled = {reader} читает книгу
book_read.with_text = <<<END
{line}:
{body}
END
unknown.reader = Игрок
no_data = (нет данных)

; Бой рядом с игроком. Серия ударов сводится в одну строку: бой каждой пары,
; затем урон ниоткуда, соединенные через join. "several" открывает сводку
; нескольких боев; "others" закрывает ту, где что-то опущено. {source} — то,
; что нанесло урон: строка source.* или имя виновника.
[Event.Combat]
combat_start = {actor} вступает в бой
combat_end = {actor} выходит из боя
collapse = {actor} валится с ног
regain_footing = {actor} снова на ногах
strike = {actor} наносит удар; цель: {target}
attack = {actor} атакует; цель: {target}
trade = {actor} и {target} обмениваются ударами
damage = {target} получает урон
damage.from = {target} получает урон; источник: {source}
damage.repeated = {target} раз за разом получает урон
damage.repeated.from = {target} раз за разом получает урон; источник: {source}
source.poison = яд
source.spell_trap = магическая ловушка
source.trap = ловушка
several = Бой продолжается: {fights}
others = {fights} и другие
join = {first}; {then}

; Перемена погоды, которую игрок заметил бы.
[Event.Weather]
blizzard_start = Началась метель.
storm_intensify = Ветер крепчает, и буря усиливается.
storm_subside = Буря стихает.
weather_shift = Погода переменилась.
storm_start = Надвигается гроза.
rain_start = Пошел дождь.
snow_start = Начинается снегопад.
rain_stop = Дождь кончился.
snow_stop = Снегопад стихает.
clear_start = Тучи разошлись, и выглядывает солнце.
cloudy_start = Небо затянуло тучами.

; Куда отправились игрок и те, кто путешествует с ним. {party} — игрок и
; его спутники, {count} — сколько их (от этого зависит число глагола).
; Строка ".interior" — здание или подземелье, а не место под открытым небом;
; ".nowhere" — когда неизвестно, откуда они пришли. journey и visit сводят
; серию перемещений, сделанных одно за другим. Названия мест стоят после
; двоеточия, в именительном падеже.
[Event.Travel]
entered_location = {party, list} {count, plural, one {прибывает} few {прибывают} many {прибывают} other {прибывают}} на место: {place}.
entered_location.interior = {party, list} {count, plural, one {входит} few {входят} many {входят} other {входят}} внутрь: {place}.
left_location = {party, list} {count, plural, one {покидает} few {покидают} many {покидают} other {покидают}} место: {place}.
left_location.interior = {party, list} {count, plural, one {выходит} few {выходят} many {выходят} other {выходят}} из помещения: {place}.
crossed_holds = {party, list} {count, plural, one {пересекает} few {пересекают} many {пересекают} other {пересекают}} границу владений (откуда: {from}, куда: {to}).
entered_wilderness = {party, list} {count, plural, one {покидает} few {покидают} many {покидают} other {покидают}} место: {origin}, и теперь {count, plural, one {находится} few {находятся} many {находятся} other {находятся}} в глуши (владение: {hold}).
entered_wilderness.exited = {party, list} {count, plural, one {выходит} few {выходят} many {выходят} other {выходят}} из помещения: {origin}, и теперь {count, plural, one {находится} few {находятся} many {находятся} other {находятся}} в глуши (владение: {hold}).
fast_travel_arrived = {party, list} {count, plural, one {прибывает} few {прибывают} many {прибывают} other {прибывают}} на место: {place}, проделав путь (откуда: {origin}).
fast_travel_arrived.interior = {party, list} {count, plural, one {входит} few {входят} many {входят} other {входят}} внутрь: {place}, проделав путь (откуда: {origin}).
fast_travel_arrived.nowhere = {party, list} {count, plural, one {прибывает} few {прибывают} many {прибывают} other {прибывают}} на место: {place}.
fast_travel_arrived.interior.nowhere = {party, list} {count, plural, one {входит} few {входят} many {входят} other {входят}} внутрь: {place}.
journey = {party, list} {count, plural, one {совершает} few {совершают} many {совершают} other {совершают}} путешествие (откуда: {origin}, куда: {arrival}).
journey.to = {party, list} в конце концов {count, plural, one {оказывается} few {оказываются} many {оказываются} other {оказываются}} на месте: {arrival}.
journey.from = {party, list} {count, plural, one {отправляется} few {отправляются} many {отправляются} other {отправляются}} в путь (откуда: {origin}).
journey.nowhere = {party, list} какое-то время {count, plural, one {путешествует} few {путешествуют} many {путешествуют} other {путешествуют}}.
visit = {party, list} {count, plural, one {посещает} few {посещают} many {посещают} other {посещают}} места: {places, list}.
visit.nowhere = {party, list} {count, plural, one {осматривается} few {осматриваются} many {осматриваются} other {осматриваются}} вокруг.
unknown = {party, list} куда-то {count, plural, one {отправляется} few {отправляются} many {отправляются} other {отправляются}}.
unknown.player = Игрок

; ============================================================================
; Отладочные уведомления
; ============================================================================

; Показываются только при включенном bDebugNotifications: помощь в
; тестировании, сообщающая то, чего персонаж знать не может.
[Notify]
courier = [NE] У курьера для тебя письмо
visitor = [NE] {visitor} идет к тебе
rumor = [NE] Распространяется новый слух; источник: {origin}
ambush = [NE] Создана засада: {group} ({attackers, plural, one {# нападающий} few {# нападающих} many {# нападающих} other {# нападающего}})
unknown.visitor = Кто-то
unknown.person = кто-то
unknown.group = неизвестная группа
font_sample = Проверка шрифтов NarrativeEngine: Café · Jörgen · naïve · Ærø · Ölfrún

; Замысел вставляется в середину фразы как "Все это — часть моего плана:
; {scheme, phrase}" и "мне удалось {scheme, phrase}", поэтому он должен быть
; инфинитивным оборотом без подлежащего. Это указание идет в английский
; промпт, поэтому оно по-английски.
[Prompt.Form]
scheme = a bare Russian infinitive clause that opens with its verb, with no subject and no leading "чтобы" (a reflexive verb in "-ся" is fine; perfective aspect where natural), e.g. "украсть Амулет Королей из кабинета Посредника" or "лишить Дж'зарго места любимого ученика Толфдира"

; ============================================================================
; Сопоставление
; ============================================================================

; Как плагин читает имена и то, что пишет модель, на этом языке.
;
; Проверка записывается списками по месту, где они ищут:
;   <Check>.Reject.Start / .Reject.End     текст не должен так начинаться / кончаться
;   <Check>.Require.Start / .Require.End   текст должен так начинаться / кончаться
;   <Check>.Match.Start / .End / .Anywhere детектор, найденный там
;   <Check>.Disabled = <причина>           проверка в этом языке выключена
; Каждый список разделен запятыми. Элемент — слова через пробел, а * в слове
; означает любые буквы: "* есть" — любое слово, за которым идет "есть", а
; "драконорожд*" подходит к "Драконорожденного". Регистр не важен. Файл языка
; дает каждой проверке правила или объясняет, почему их нет; проверка, о
; которой он молчит, не берется из английского.
;
; Scheme: замысел цитируется в "Все это — часть моего плана: ..." и "мне
; удалось ...", поэтому он должен быть инфинитивным оборотом. Первое слово
; должно быть инфинитивом (на -ть, -ти, -чь, с -ся или без), можно после
; "не". Существительное на -ость или "месть", "власть", "смерть" в начале, а
; также "пусть" выдают именную фразу или пожелание вместо указания.
;
; PlayerTitle: как модель называет игрока, когда имеет в виду его. Ни один
; NPC в Skyrim так не зовется.
;
; Ghost: призрак, которого игра не пометила флагом, говорит об этом в имени;
; русская версия ставит "призрак" в конце ("Данмер-призрак", "Покоренный
; призрак") или в начале ("Призрак Хельги").
;
; Простые списки:
; Name.Suffixes: падежные окончания, с которыми имя в тексте все еще означает
; этого человека ("Толфдира", "Толфдиру", "Толфдиром", "об Ульфрике").
; Name.Titles: звания, с которых начинается имя, слишком общие, чтобы указать
; на кого-то: просто "капитан" — это не какой-то определенный капитан.
; Item.Articles: с чего может начинаться название вещи, чего текст о ней
; может не повторять. [Plot.Item] пишет названия, которые так начинаются.
; Title.Strip.Start: титулы, которые запасное название письма может снять с
; начала имени отправителя. Title.Strip.After: слова, после которых идет
; прозвище; в русском их нет ("Балгруф Старший"), поэтому список пуст.
[Matching]
