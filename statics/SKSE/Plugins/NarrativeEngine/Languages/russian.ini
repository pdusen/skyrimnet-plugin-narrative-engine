; ============================================================================
; NarrativeEngine — Русский
; ============================================================================
;
; Каждая фраза, которую NarrativeEngine показывает игроку или записывает в
; воспоминание, в co-save или в игру, берется из такого файла: по одному на
; язык, по имени языковой настройки самого Skyrim (sLanguage), все в UTF-8.
;
; Образец — английский. Любой ключ, которого здесь нет или который записан с
; ошибкой, берется из английского файла, по одному ключу, и журнал сообщает,
; какой именно.
;
; Как изменить текст
; ------------------
; Не правьте этот файл: следующее обновление NarrativeEngine его заменит.
; Впишите нужные строки в файл russian.custom.ini рядом с ним, в тот же
; раздел; они заменяют эти ключи по одному. Тот файл никогда не поставляется,
; поэтому обновления его не трогают.
;
; Шаблоны
; -------
;   {agent}                                         значение; у персонажа — имя
;   {agent, select, female {...} male {...} other {...}}
;                                                   по полу персонажа
;   {days, plural, one {# день} few {# дня} many {# дней} other {# дня}}
;                                                   по числу
;   {names, list}                                   список, соединенный по [Grammar]
;   {scheme, phrase}                                текст, подрезанный для середины фразы
;
; Фигурная скобка вне этих форм — ошибка, и строка возвращается к английской.
; Каждый ключ принимает только те подстановки, которые дает ему плагин;
; журнал называет каждую строку, где использована чужая.
;
; Имена в русском склоняются, а шаблон этого не умеет, поэтому имена здесь
; всегда стоят в именительном падеже: как подлежащее ("{mark} заметил
; слежку"), после двоеточия или тире, или после слова, которое берет падеж на
; себя ("в окрестностях места {place}"). Глаголы прошедшего времени
; согласуются с полом персонажа через select; "other" — мужской род. Буква ё
; не используется: в шрифтах игры ее нет.
;
; Комментарий должен стоять на отдельной строке. Знак ';' после значения —
; часть значения.

[Language]
Name = Russian
NativeName = Русский
Code = ru
Status = draft
PluralRule = russian
Fonts = ru, ja, cn

; Кавычки вокруг значения сохраняют пробелы на его концах.
[Grammar]
ListSeparator = ", "
ListPairSeparator = " и "
ListFinalSeparator = " и "
CapitalizeSentenceStart = true
PhraseTrailingPunctuation = ".!?;,"
PhraseLowercaseFirst = true
; В русском нет артиклей, поэтому оба поля пусты, а [Plot.Item] обходится
; без {article}.
IndefiniteArticle =
IndefiniteArticleBeforeVowel =

; ============================================================================
; Интриги
; ============================================================================
;
; Интрига — это замысел, исполняемый по шагам, и каждый шаг — один из
; заданного набора глаголов (следить, украсть, донести...). Фразы каждого
; глагола записаны ниже под его идентификатором. В них могут быть {agent} —
; исполнитель шага; {mastermind} — автор замысла; {scheme} — сам замысел; и
; собственные места глагола ({mark}, {item}, {place}, ...). {scheme, phrase}
; подрезает замысел для середины фразы: "Все это — часть моего плана:
; {scheme, phrase}." Поэтому замысел — инфинитивный оборот (см. [Prompt.Form]).

; Фраза панели для шага и подпись под его узлом.
