; Кем рассказчик слуха приходится тому, кто его помнит: {kin} в
; [Gossip.Memory]. Типы связей в игре несут эти слова только по-английски,
; поэтому они записаны здесь: по EditorID типа, стороне рассказчика (parent —
; первый, как отец; child — второй, как сын) и его полу. Слово стоит в
; именительном падеже, после "мой" или "моя" по полу рассказчика. Строка с
; .listener_male или .listener_female уточняет слово по полу того, кто помнит,
; и проверяется первой: отец жены — тесть, отец мужа — свекор. Где русский
; таких слов не различает, остается только общая строка.
