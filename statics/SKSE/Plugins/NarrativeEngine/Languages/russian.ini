; английская строка, число там, где стоит {n, plural, ...}, и текст в
; остальных местах. Поэтому каждое число записано как plural, даже там, где
; английские слова не меняются: это позволяет русскому его склонять.
;
; <b>...</b>, <strong>...</strong> и <i>...</i> отмечают выделение в строках,
; где оно есть, чтобы выделение могло двигаться вместе со словами.
