; ============================================================================
; NarrativeEngine — Italiano
; ============================================================================
;
; Ogni frase che NarrativeEngine mostra al giocatore, o scrive in un ricordo,
; nel co-save o nel gioco, viene da un file come questo: uno per lingua,
; chiamato come l'impostazione della lingua di Skyrim (sLanguage), tutti in
; UTF-8.
;
; L'inglese è il riferimento. Ogni chiave che manca in questo file, o che è
; scritta male, viene presa da english.ini, una chiave alla volta, e il log
; dice quale.
;
; Cambiare le parole
; ------------------
; Non modificare questo file per cambiare una frase: il prossimo
; aggiornamento di NarrativeEngine lo sostituisce. Scrivi le righe da
; cambiare in italian.custom.ini, accanto a questo, sotto la stessa sezione:
; prevalgono su queste, chiave per chiave. Quel file non viene mai
; distribuito, quindi gli aggiornamenti non lo toccano.
;
; Modelli
; -------
;   {agent}                                         un valore; il nome di una persona
;   {agent, select, female {...} male {...} other {...}}
;                                                   scelto in base al sesso della persona
;   {days, plural, one {# giorno} other {# giorni}} scelto in base a un numero
;   {names, list}                                   un elenco, unito come dice [Grammar]
;   {scheme, phrase}                                testo adattato per stare dentro una frase
;
; Una graffa che non fa parte di uno di questi è un errore, e la riga torna
; all'inglese. Ogni chiave accetta solo i segnaposto che il plugin le
; fornisce; il log segnala ogni riga che ne usa uno non previsto.
;
; I commenti vanno su una riga a sé. Un ';' dopo un valore fa parte del
; valore.

[Language]
Name = Italian
NativeName = Italiano
Code = it
Status = draft
PluralRule = spanish
Fonts = en, pl, ru, ja, cn

; Racchiudi un valore tra virgolette doppie per conservare gli spazi agli
; estremi.
[Grammar]
ListSeparator = ", "
ListPairSeparator = " e "
ListFinalSeparator = " e "
CapitalizeSentenceStart = true
PhraseTrailingPunctuation = ".!?;,"
PhraseLowercaseFirst = true
; L'articolo davanti al nome di un oggetto fabbricato, come {article} in
; [Plot.Item]. In italiano l'articolo dipende dal genere del nome, quindi
; restano vuoti e i modelli di [Plot.Item] non lo usano.
IndefiniteArticle =
IndefiniteArticleBeforeVowel =

; ============================================================================
; Intrighi
; ============================================================================
;
; Un intrigo è un piano portato avanti a passi, e ogni passo è uno di un
; insieme fisso di verbi (sorvegliare, rubare, denunciare, ...). Le frasi di
; ogni verbo qui sotto sono indicate dal suo id. Possono nominare {agent},
; chi esegue il passo; {mastermind}, la mente dell'intrigo; {scheme}, il
; piano stesso; e i ruoli propri del verbo ({mark}, {item}, {place}, ...).
; {scheme, phrase} adatta il piano per stare a metà frase: "il mio piano per
; {scheme, phrase}."

; La frase del pannello per un passo, e la didascalia sotto il suo nodo.
[Plot.Dashboard]
