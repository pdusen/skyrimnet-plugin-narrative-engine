; ============================================================================
; Il registro delle decisioni del Regista
; ============================================================================

; Come si legge una decisione andata male, nel pannello e nella cronologia
; del Regista. {detail} è ciò di cui si trattava, così com'è arrivato: l'id
; di un beat, la risposta del modello, o il motivo per cui la sua scelta è
; stata rifiutata.
