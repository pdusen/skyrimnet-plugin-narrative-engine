; ============================================================================
; Riconoscimento
; ============================================================================

; Come il plugin legge i nomi e ciò che scrive il modello, in questa lingua.
;
; Un controllo si scrive come elenchi indicati dal punto del testo che
; guardano:
;   <Check>.Reject.Start / .Reject.End     il testo non deve iniziare / finire così
;   <Check>.Require.Start / .Require.End   il testo deve iniziare / finire così
;   <Check>.Match.Start / .End / .Anywhere un rilevatore, trovato lì
;   <Check>.Disabled = <motivo>            il controllo è spento in questa lingua
; Ogni elenco è separato da virgole. Una voce è fatta di parole separate da
; spazi, e * in una parola sta per qualsiasi lettera: "* vuole" è una parola
; qualsiasi seguita da "vuole", e "*re" corrisponde a "rubare". Maiuscole e
; minuscole non contano. Il file di una lingua dà regole a ogni controllo
; qui sotto, o dice perché non ne ha; un controllo di cui non dice nulla non
; viene preso dall'inglese.
;
; Ogni parola di ogni voce cita il record del gioco da cui è presa, con una
; riga "; cite <parola>: <percorso>" sopra la chiave.
;
; Scheme: un piano, e il modo in cui si conclude, viene citato dentro "il mio
; piano per ..." in ogni ricordo che un intrigo scrive, quindi deve essere
; una proposizione all'infinito senza soggetto: "rubare l'Amuleto dei Re".
; Deve cominciare con un infinito (anche tronco, "far", o con pronomi
; attaccati, "portarlo", "sbarazzarsene"), e non con un pronome, un
; articolo, "per" o un nome seguito da ciò che intende fare.
;
; PlayerTitle: come un modello chiama il giocatore quando intende lui.
; Nessun PNG di Skyrim porta questo titolo; Miraak resta Miraak.
;
; Ghost: un'apparizione che il flag di fantasma del gioco non coglie lo dice
