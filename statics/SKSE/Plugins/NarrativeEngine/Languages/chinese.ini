; 傳言的講述者是記住它的聽者的什麼人：[Gossip.Memory] 的 {kin}（「我的{kin}{teller}
; 跟我說了這件事」）。鍵是關係類型、講述者在關係中的一方（parent：先提到的一方，
; 如父親；child：後提到的一方，如兒子），以及講述者的性別。遊戲的關係類型只有英文，
; 所以每個詞都在這裡寫出。公婆與岳父母要看聽者是哪一方嫁娶過來的，所以另以
; .listener_female／.listener_male 依聽者的性別細分，未細分的那一行是後備。其他姻親
