; ============================================================================
; 提示詞中的格式說明
; ============================================================================

; 告訴模型 {scheme} 必須寫成什麼形式，才能放進上面的範本（以英文寫成，因為
; 它會放進英文提示詞中）。與下方 [Matching] 的 Scheme 檢查是一對，要一起修改。
[Prompt.Form]
scheme = a bare Chinese verb phrase with no subject, opening with its verb (a causative 讓 or a preposition such as 向 or 把 before the verb is fine) and ending without any particle such as 了, 吧 or 呢, so that it reads after 為了 and before 的計劃, e.g. "從掮客手中奪走諸王護符" or "讓紮格失去托夫迪爾得意門生的地位"

; ============================================================================
; 比對
; ============================================================================

; 外掛如何以這種語言讀取名字與模型寫出的內容。
;
; 一項檢查寫成依位置分類的清單：
;   <Check>.Reject.Start / .Reject.End     文字不得以此開頭／結尾
;   <Check>.Require.Start / .Require.End   文字必須以此開頭／結尾
;   <Check>.Match.Start / .End / .Anywhere 偵測器，在該位置找到即觸發
;   <Check>.Disabled = <原因>              這項檢查在此語言中關閉
; 每份清單以逗號分隔。中文詞與詞之間不留空格（WordSeparated = false），所以
; 每個條目都當作一串字元，在其位置比對，文字兩端的空格與標點不計；條目中的 *
; 代表任意字元。每項檢查都必須在此給出規則，或說明為何沒有；沒提到的檢查不會
; 改用英文的規則。
;
; Scheme：計劃會被引進每一則陰謀記憶的「為了……」與「……的計劃」之中，所以
; 必須是沒有主語的動詞片語。中文動詞沒有詞形變化，能抓的只有模型實際會犯的
; 錯：開頭寫了主語（他、她、我……）、開頭重複了範本自己的「為了」或寫成
; 「打算……」，以及結尾帶了語氣詞或「了」，或自己就以「計劃」結尾。
;
; PlayerTitle：模型指玩家時對玩家的稱呼。Skyrim 中沒有 NPC 叫這個名字。
;
; Ghost：遊戲的鬼魂旗標漏掉的幽靈，會在名字中寫明；中文版把「鬼魂」放在
; 名字最後（「丹莫鬼魂」）。
;
; 簡單清單：
; Name.Suffixes：名字在文中可帶的詞尾。中文名字不變形，而且名字是以字元串
; 在文中直接搜尋，所以清單留空。
; Name.Titles：名字中太常見、無法指認任何人的稱號：單說「隊長」並不是哪一位
; 特定的隊長。中文的稱號多半放在名字後面（「艾迪斯隊長」、「艾利西弗領主」）。
; Item.Articles：物品名稱開頭可帶、提到該物品的文字不必重複的字詞。[Plot.Item]
; 寫出的名稱就是以它們開頭。
; Title.Strip.Start：信件替代標題可從寄信人名字前面去掉的稱號。外掛只會去掉
; 後面接著空格的稱號，而中文的稱號多半在名字後面、也不留空格，所以清單留空。
; Title.Strip.After：綽號前面的字詞，讓「Balgruuf the Greater」能變成
; 「Balgruuf」。中文的綽號放在名字前面（「強者巴爾古夫」），所以清單留空。
[Matching]
