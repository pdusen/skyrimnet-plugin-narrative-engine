; ============================================================================
; NarrativeEngine — 中文（繁體）
; ============================================================================
;
; NarrativeEngine 顯示給玩家、或寫進記憶、共同存檔與遊戲中的每一句話，都來自
; 這樣的檔案：每種語言一個，以 Skyrim 本身的語言設定（sLanguage）命名，
; 全部使用 UTF-8。
;
; 英文是基準。本檔缺少或寫錯的鍵，會逐一改用英文檔中的內容，並在記錄檔中
; 註明是哪一個。
;
; 修改文字
; --------
; 請勿直接修改本檔：NarrativeEngine 下次更新時會覆蓋它。請把要修改的行寫進
; 同一資料夾中的 chinese.custom.ini，放在相同的區段下，就能逐鍵覆蓋本檔。
; 那個檔案不會隨模組發布，所以更新永遠不會動到它。
;
; 範本
; ----
;   {agent}                                         一個值；若是人物，就是其名字
;   {agent, select, female {...} male {...} other {...}}
;                                                   依人物的性別選擇
;   {days, plural, other {#天}}                     依數字選擇（中文不分單複數）
;   {names, list}                                   一份清單，依 [Grammar] 連接
;   {scheme, phrase}                                修剪過、可嵌在句中的文字
;
; 不屬於上述形式的大括號是錯誤，該行會改用英文。每個鍵只能使用外掛提供給它的
; 佔位符；記錄檔會列出用了其他佔位符的行。
;
; 中文不分性別變化，但書面上「他」與「她」有別，所以提到某人時以 select 選擇
; 代名詞；性別不明（other）時用「他」。
;
; 註解必須獨占一行。值後面的「;」屬於值的一部分。

[Language]
Name = Chinese
NativeName = 中文
Code = zh
Status = draft
PluralRule = none
Fonts = cn

; 以雙引號包住值，可保留其兩端的空格。
[Grammar]
ListSeparator = 、
ListPairSeparator = 和
ListFinalSeparator = 和
CapitalizeSentenceStart = false
PhraseTrailingPunctuation = "。，、；：！？.!?;,"
PhraseLowercaseFirst = false
; 中文書寫時詞與詞之間不留空格，[Matching] 的每個條目都以字元串比對。
WordSeparated = false
; 中文沒有冠詞，所以兩者皆留空，[Plot.Item] 也不使用 {article}。
IndefiniteArticle =
IndefiniteArticleBeforeVowel =

; ============================================================================
; 陰謀
; ============================================================================
;
; 陰謀是分步驟執行的計劃，每一步都是一組固定動詞之一（監視、偷竊、告發……）。
; 每個動詞的句子都在下方，以其代號為鍵。句中可提到 {agent}，執行這一步的人；
; {mastermind}，主使者；{scheme}，計劃本身；以及動詞自己的欄位（{mark}、
; {item}、{place}……）。{scheme, phrase} 把計劃修剪成可嵌在句中的動詞片語：
; 「為了{scheme, phrase}，……」與「我{scheme, phrase}的計劃……」。所以計劃
; 必須是沒有主語的動詞片語（見 [Prompt.Form]）。

