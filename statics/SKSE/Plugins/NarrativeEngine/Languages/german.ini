minute = {n, plural, one {# Minute} other {# Minuten}}
hour = {n, plural, one {# Stunde} other {# Stunden}}
day = {n, plural, one {# Tag} other {# Tagen}}
week = {n, plural, one {# Woche} other {# Wochen}}

