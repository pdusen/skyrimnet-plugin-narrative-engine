; ============================================================================
; Abgleich
; ============================================================================

; Die Form, in der das Modell ein Feld schreiben soll, auf Englisch, weil sie
; in einen englischen Prompt eingefügt wird. scheme steht hinter "Plan," als
; Infinitiv mit "zu" – und die Prüfung Scheme unten verlangt genau das.
[Prompt.Form]
scheme = a German infinitive clause with no subject, ending in "zu" plus the verb or in a verb with "zu" built in (never opening with "um", and not a "dass" clause), e.g. "das Amulett der Könige zu stehlen" or "Ancanos Geheimnisse aufzudecken"

; Wie das Plugin Namen und die Texte des Modells in dieser Sprache liest.
;
; Eine Prüfung besteht aus Listen, benannt danach, wo im Text sie suchen:
;   <Check>.Reject.Start / .Reject.End     so darf der Text nicht beginnen / enden
;   <Check>.Require.Start / .Require.End   so muss der Text beginnen / enden
;   <Check>.Match.Start / .End / .Anywhere ein Detektor, dort gefunden
;   <Check>.Disabled = <Grund>             die Prüfung ist in dieser Sprache aus
; Jede Liste ist kommagetrennt. Ein Eintrag sind Wörter, durch Leerzeichen
; getrennt, und * in einem Wort steht für beliebige Buchstaben: "* ist" ist
; ein beliebiges Wort, gefolgt von "ist", und "drachenblut*" passt auf
; "Drachenbluts". Groß- und Kleinschreibung zählt nie. Jede Prüfung bekommt
; hier Regeln oder einen Grund, warum sie keine hat; eine Prüfung, zu der die
; Datei schweigt, wird nicht aus dem Englischen übernommen.
;
; Scheme: ein Plan wird in jeder Erinnerung einer Intrige hinter "Plan,"
; zitiert, muss also ein Infinitiv mit "zu" sein, der am Ende steht ("zu
; stehlen", "aufzudecken"). Ein Subjekt, ein "um" vorn oder ein Name mit
; konjugiertem Verb dahinter verraten einen falsch gebauten Plan.
;
; PlayerTitle: wie ein Modell den Spieler nennt, wenn es ihn meint. Kein NPC
; in Skyrim trägt den Titel; Miraak bleibt Miraak.
;
; Ghost: eine Erscheinung, die das Geist-Flag des Spiels übersieht, sagt es in
; ihrem Namen ("Dunmer-Geist", "Abenteurergeist"). Im Deutschen deckt "Geist"
; auch Spirit, Wraith und Familiar ab.
;
; Einfache Listen:
; Name.Suffixes: die Endungen, die ein Personenname im Text tragen kann und
; trotzdem derselbe bleibt ("Tolfdirs").
; Name.Titles: Anreden, mit denen ein Name beginnt und die zu vielen Leuten
; gehören, um zu sagen, wen ein Text meint: "Hauptmann" allein ist kein
; bestimmter Hauptmann.
; Item.Articles: womit der Name eines Dings beginnen kann, das ein Text, der
; es nennt, nicht wiederholen muss. [Plot.Item] schreibt die Namen, die damit
; beginnen.
; Title.Strip.Start: Titel, die der Ersatztitel eines Briefes vorn vom Namen
; des Absenders weglassen darf. Title.Strip.After: die Wörter, denen ein
; Beiname folgt, damit aus "Balgruuf der Ältere" "Balgruuf" werden kann.
[Matching]
