; Der Ereignisverlauf
; ============================================================================

; Wie die Ereignisliste des Dashboards und das Ereignisprotokoll in Worte
; fassen, was um den Spieler herum geschehen ist. Der Director liest dieselben
; Ereignisse, aber seine Prompts formulieren sie selbst. Das Protokoll ist
; immer auf Englisch; das Dashboard zeigt diese Zeilen.

