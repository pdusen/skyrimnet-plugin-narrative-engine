heard.rumor = Ich habe ein Gerücht gehört, das die Runde macht: {band}
told = Ich habe {listeners, list} Folgendes erzählt: {band}
unknown.person = jemand
unknown.hold = der Ferne

; ============================================================================
; Briefe
; ============================================================================

; Die Erinnerung des Schreibers an einen abgeschickten Brief, die ihn dann zitiert.
[Letter.Memory]
sent = <<<END
Ich habe einen Brief an {recipient} geschrieben und abgeschickt. Er lautete wie folgt:

{body}
END
unknown.recipient = den Empfänger

; ============================================================================
; Besuche
; ============================================================================

; Erzähltext, den SkyrimNet aufzeichnet und spricht, wenn ein Besuch endet,
; weitergeht oder abgebrochen wird. {visitor} ist der NPC, der kam; {player}
; der Spieler. unknown.player steht im Dativ (reengage), unknown.visitor nach
; "mit" (walked_out), unknown.sender als Subjekt.
[Visit.Narration]
walked_out = {player} ist mitten im Gespräch mit {visitor} einfach gegangen.
