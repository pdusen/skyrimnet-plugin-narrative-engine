went_on = , aber ich habe einen anderen Weg gefunden, meinen Plan weiterzuverfolgen, {scheme, phrase}.

; Wie eine Rolle lautet, bevor jemand sie besetzt, und eine Intrige ohne Plan.
; "jemand" bleibt in jedem Fall unverändert; scheme ist ein zu-Infinitiv wie
; jeder Plan.
[Plot.Unfilled]
person = jemand
place = irgendeinen Ort
thing = etwas
scheme = mein Ziel zu erreichen

; Wie ein Gegenstand heißt, den ein Handwerker herstellt. Ohne Artikel, weil
; er vom Geschlecht des Namens abhinge; Munition kommt als Bündel.
[Plot.Item]
made = {name}
ammo = ein Bündel {name}

; Wem die Bloßstellung eines Anführers vorgelegt wird, wenn das seine
; Gemeinschaft statt einer Person ist: ihre Siedlung oder, wenn sie keine hat,
; einfach die Menschen, die er führt. Im Dativ, wie jede {authority}.
