settlement = den Leuten von {settlement}

; ============================================================================
; Gerüchte
; ============================================================================

; Wie ein Zuhörer sich erinnert, ein Gerücht gehört zu haben, und ein
; Erzähler, es erzählt zu haben. {band} sind die Worte des Gerüchts, ein Satz
; oder mehrere, darum endet jede Einleitung mit einem Doppelpunkt statt mit
; einem "dass", das nur den ersten Satz regieren könnte. {kin} ist das Wort
; des Spiels für den Erzähler ("Schwester"); {hold} ist, woher er kam, oder
; unknown.hold (nach "aus").
[Gossip.Memory]
heard.kin_from_away = {teller, select, female {Meine} other {Mein}} {kin} {teller} kam aus {hold} und brachte Neuigkeiten mit: {band}
heard.kin = {teller, select, female {Meine} other {Mein}} {kin} {teller} hat mir Folgendes erzählt: {band}
