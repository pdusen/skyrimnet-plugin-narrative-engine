valediction.ignored = {visitor} konnte das Gespräch nicht halten und schickt sich an zu gehen, verärgert darüber, ignoriert worden zu sein.
reengage = Jetzt, da die Unterbrechung vorbei ist, wendet sich {visitor} wieder {player} zu, um das Gespräch dort fortzusetzen, wo es abgebrochen ist.
unknown.player.opening = Der Spieler
unknown.player = dem Spieler
unknown.visitor = dem Besucher
unknown.sender = der Absender

; Wie der Ersatztitel eines Briefes lautet, wenn sein eigener Titel fehlt oder
; zu lang ist: ein Buchtitel fasst 24 Zeichen, also wird der Name des
; Absenders gekürzt, bis der ganze Titel passt. Die Gegenstandskarte ist die
; Zeile unter dem Namen eines Briefes im Inventar.
[Letter]
