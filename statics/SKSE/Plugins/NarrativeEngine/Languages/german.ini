; ============================================================================
; NarrativeEngine — Deutsch
; ============================================================================
;
; Jeder Satz, den NarrativeEngine einem Spieler zeigt oder in eine Erinnerung,
; den Co-Save oder das Spiel schreibt, stammt aus einer Datei wie dieser: eine
; pro Sprache, benannt nach Skyrims eigener Spracheinstellung (sLanguage),
; alle in UTF-8.
;
; Englisch ist die Referenz. Jeder Schlüssel, der hier fehlt oder fehlerhaft
; ist, wird einzeln von dort übernommen, und das Log sagt, welcher.
;
; Texte ändern
; ------------
; Ändere diese Datei nicht selbst: das nächste Update von NarrativeEngine
; ersetzt sie. Schreibe die Zeilen, die du ändern willst, stattdessen in
; german.custom.ini daneben, unter denselben Abschnitt; sie überschreiben
; diese Schlüssel einzeln. Jene Datei wird nie ausgeliefert, Updates
; berühren sie also nie.
;
; Vorlagen
; --------
;   {agent}                                         ein Wert; bei einer Person ihr Name
;   {agent, select, female {...} male {...} other {...}}
;                                                   nach dem Geschlecht einer Person
;   {days, plural, one {# Tag} other {# Tage}}      nach einer Zahl
;   {names, list}                                   eine Liste, verbunden wie in [Grammar]
;   {scheme, phrase}                                Text, zugeschnitten für die Satzmitte
;
; Eine geschweifte Klammer, die zu keinem davon gehört, ist ein Fehler, und
; die Zeile fällt auf Englisch zurück. Jeder Schlüssel nimmt nur die
; Platzhalter, die das Plugin ihm liefert; das Log nennt jede Zeile, die
; einen anderen verwendet.
;
; Kommentare stehen in einer eigenen Zeile. Ein ';' nach einem Wert gehört
; zum Wert.

[Language]
Name = German
NativeName = Deutsch
Code = de
Status = draft
PluralRule = one_other
Fonts = en, pl, ru, ja, cn

; Anführungszeichen um einen Wert erhalten Leerzeichen an seinen Enden.
[Grammar]
ListSeparator = ", "
ListPairSeparator = " und "
ListFinalSeparator = " und "
CapitalizeSentenceStart = true
PhraseTrailingPunctuation = ".!?;,"
PhraseLowercaseFirst = false
; Der Artikel richtet sich im Deutschen nach dem Geschlecht des Nomens, also
; bleiben beide leer, und [Plot.Item] kommt ohne {article} aus.
IndefiniteArticle =
IndefiniteArticleBeforeVowel =

; ============================================================================
; Intrigen
; ============================================================================
;
; Eine Intrige ist ein Plan, der in Schritten ausgeführt wird, und jeder
; Schritt ist eines aus einer festen Menge von Verben (beobachten, stehlen,
; anschwärzen, ...). Die Sätze jedes Verbs sind unten nach seiner ID
; geordnet. Sie können {agent} nennen, der den Schritt ausführt;
; {mastermind}, wessen Plan es ist; {scheme}, den Plan selbst; und die
; eigenen Rollen des Verbs ({mark}, {item}, {place}, ...). {scheme, phrase}
; ist ein Infinitiv mit "zu", der als Attribut hinter "Plan" steht:
; "als Teil meines Plans, {scheme, phrase}."
;
; {authority} steht überall im Dativ ("bei {authority}", "{authority} ...
; vorlegen"), weil [Plot.Audience] im Dativ geschrieben ist.

