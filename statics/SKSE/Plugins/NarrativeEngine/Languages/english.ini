; ============================================================================
; Matching
; ============================================================================

; How the plugin reads names and what the model writes, in this language.
;
; A check is written as lists keyed by where in the text they look:
;   <Check>.Reject.Start / .Reject.End     the text must not begin / end so
;   <Check>.Require.Start / .Require.End   the text must begin / end so
;   <Check>.Match.Start / .End / .Anywhere a detector, found there
;   <Check>.Disabled = <why>               the check is off in this language
; Each list is comma-separated. An entry is words separated by spaces, and *
; in a word stands for any letters: "* is" is any word followed by "is", and
; "drachenblut*" matches "Drachenbluts". Case never matters. A language
; written without spaces (WordSeparated = false) matches each entry as
; characters. A language's file gives every check here rules, or says why it
; has none; a check it says nothing of is not taken from English instead.
;
; Scheme: a scheme, and how it finishes, is quoted inside "my plan to ..." in
; every memory a plot writes, so it must read as an instruction. In English
; the giveaway is at the start: a pronoun, an article or "to" first, or a name
; followed by what they mean to do. "It's" stands beside "it" and "its".
;
; PlayerTitle: what a model calls the player when it means them. No NPC in
; Skyrim wears it; Miraak is still Miraak.
;
; Ghost: an apparition the game's ghost flag misses says so in its name.
;
; Plain lists:
; Name.Suffixes: the endings a person's name may carry in text and still be
; them ("Varian's").
; Name.Titles: honorifics a name opens with, too many people's to say who a
; text means: "Captain" alone is no particular captain.
; Item.Articles: what a thing's name may open with, which a text naming the
; thing need not repeat: "the gold diamond necklace" names "a Gold Diamond
; Necklace". [Plot.Item] writes the names that open with them.
; Title.Strip.Start: titles a letter's fallback title may drop from the front
; of a sender's name. Title.Strip.After: the words an epithet follows, so that
; "Balgruuf the Greater" can become "Balgruuf".
[Matching]
Scheme.Reject.Start = he, she, they, it, it's, i, we, you, his, her, their, its, my, our, the, a, an, this, that, these, those, to, * is, * was, * will, * has, * had, * plans, * wants, * means, * intends, * would, * could, * must, * seeks
PlayerTitle.Match.Anywhere = dragonborn, dragonborn's
Ghost.Match.End = ghost, *-ghost
Name.Suffixes = 's
Name.Titles = elder, captain, commander, general, legate, jarl, chief, thane, brother, sister, mother, father, master, lady
Item.Articles = a sheaf of, an, a
Title.Strip.Start = Jarl, Thane, Master, Mistress, Captain, Commander, Housecarl, Lord, Lady, Sir, Brother, Sister, Mother, Father
Title.Strip.After = the

