set.mastermind_told_failed = {agent} reported back that they had spoiled the work on {item}.
set.mastermind_told_timed_out = {agent} reported back that they had run out of time before finishing {item}.
set.mastermind_told_succeeded = {agent} reported back that they had made {item}.
fletch.agent_dispatched = {mastermind} asked me to fletch {item} for them, so I set to work.
fletch.mastermind_dispatched = I asked {agent} to fletch {item} for me, as part of my plan to {scheme, phrase}.
fletch.self_dispatched = I decided to fletch {item} myself, as part of my plan to {scheme, phrase}.
fletch.agent_succeeded = I fletched {item}, true and straight.
fletch.agent_failed = I spoiled the work on {item}.
fletch.agent_timed_out = I ran out of time before I could finish fletching {item}.
fletch.mastermind_told_failed = {agent} reported back that they had spoiled the work on {item}.
fletch.mastermind_told_timed_out = {agent} reported back that they had run out of time before finishing {item}.
fletch.mastermind_told_succeeded = {agent} reported back that they had fletched {item}.

; What a person a step reached remembers of it, keyed by verb and slot:
;   failed      it went wrong in front of them: they caught the agent
;   succeeded   it was done to them openly
;   noticed     it was done quietly, and left something they noticed --
;               so it names nobody
[Plot.Remembered]
watch.mark.failed = I caught {agent} watching me.
ask_around.mark.failed = I heard that {agent} was asking questions about me around {place}.
steal.mark.failed = I caught {agent} trying to steal {item} from me.
steal.mark.noticed = Someone stole {item} from me.
buy.seller.failed = {agent} tried to buy {item} from me, but the deal went sour.
buy.seller.succeeded = I sold {item} to {agent}.
deliver.recipient.failed = {agent} set out to bring me {item}, but never arrived.
deliver.recipient.succeeded = {agent} brought me {item}.
plant.mark.failed = I caught {agent} trying to hide {item} among my belongings.
bribe.mark.failed = {agent} offered me coin to look the other way, and I refused it.
bribe.mark.succeeded = {agent} paid me to look the other way.
win_over.mark.failed = {agent} tried to win me over to {mastermind}'s side, but I would not be swayed.
win_over.mark.succeeded = {agent} won me over to {mastermind}'s side.
threaten.mark.failed = {agent} warned me to stay out of {mastermind}'s affairs, but I would not be frightened.
threaten.mark.succeeded = {agent} warned me to stay out of {mastermind}'s affairs, and I took the warning to heart.
spread_rumors.mark.failed = I found out that {agent} was spreading ugly talk about me around {place}.
spread_rumors.mark.noticed = Someone has been spreading ugly talk about me around {place}.
denounce.mark.succeeded = {agent} denounced me to {authority}.
denounce.authority.failed = {agent} came to me denouncing {mark}, and I was not convinced.
denounce.authority.succeeded = {agent} came to me denouncing {mark}, and I believed them.
sabotage.mark.failed = I caught {agent} trying to sabotage my livelihood.
sabotage.mark.noticed = Someone has been sabotaging my livelihood.
silence.witness.failed = {agent} offered me coin to keep quiet, and I refused it.
silence.witness.succeeded = {agent} paid me to keep quiet.
falsify.subject.failed = I found out that {agent} had tried to falsify {item} in my name.
dig_up.mark.failed = I found out that {agent} was digging into my affairs.
blackmail.mark.failed = {agent} tried to blackmail me into serving {mastermind}, but I called their bluff.
blackmail.mark.succeeded = {agent} blackmailed me into serving {mastermind}.
destroy.mark.failed = I caught {agent} trying to destroy {item} of mine.
destroy.mark.noticed = Someone destroyed {item} of mine.
petition.authority.failed = {agent} petitioned me on {mastermind}'s behalf, and I turned them away.
petition.authority.succeeded = {agent} petitioned me on {mastermind}'s behalf, and I granted it.
expose.mark.succeeded = {agent} showed {item} to {authority} as proof against me.
expose.authority.failed = {agent} showed me {item} as proof against {mark}, but I was not convinced.
expose.authority.succeeded = {agent} showed me {item} as proof against {mark}, and it convinced me.

; The mastermind's last memory of a plot. went_on ends the memory of a failed
; step when the plot goes on another way, so it opens mid-sentence.
[Plot.Outcome]
succeeded = I brought off my plan to {scheme, phrase}.
failed = My plan to {scheme, phrase} came to nothing.
conceded = I gave up on my plan to {scheme, phrase}.
went_on = , but I found another way to go on with my plan to {scheme, phrase}.

; What a slot reads as before anyone fills it, and a plot with no scheme.
[Plot.Unfilled]
person = someone
place = somewhere
thing = something
scheme = it

; How an item a craftsman makes is named in a step: "an Iron Sword", "a
; sheaf of Elven Arrows". {article} is from [Grammar].
[Plot.Item]
made = {article} {name}
ammo = a sheaf of {name}s

; ============================================================================
; Gossip
; ============================================================================

; How a listener remembers hearing a rumor, and a teller telling it. {band}
; is the rumor's own words, one sentence or several, so every lead-in ends in
; a colon rather than a "that", which could only govern the first sentence.
; {kin} is the game's own word for the teller ("sister"); {hold} is where the
; teller came from, or unknown.hold.
[Gossip.Memory]
heard.kin_from_away = My {kin} came from {hold} with news: {band}
heard.kin = My {kin} {teller} told me this: {band}
heard.household = {teller} mentioned this over supper: {band}
heard.settlement = {teller} told me this: {band}
heard.rumor = I heard a rumor going round: {band}
told = I told {listeners, list} this: {band}
unknown.person = someone
unknown.hold = away

; ============================================================================
; Letters
; ============================================================================

; The writer's memory of sending a letter, which goes on to quote it.
[Letter.Memory]
sent = <<<END
I wrote and sent a letter to {recipient}. The contents were as follows:

{body}
END
unknown.recipient = the recipient

; ============================================================================
; Visits
; ============================================================================

; Narration SkyrimNet records, and speaks from, as a visit ends, resumes, or
; is walked out on. {visitor} is the NPC who came; {player} the player.
[Visit.Narration]
walked_out = {player} left abruptly, in the middle of their conversation with {visitor}.
valediction = Having said what needed saying, {visitor} prepares to take their leave.
valediction.ignored = Having failed to hold the conversation, {visitor} prepares to leave, frustrated by being ignored.
reengage = Now that the interruption has ended, {visitor} turns back to {player} to try and resume their discussion where it left off.
unknown.player.opening = The player
unknown.player = the player
unknown.visitor = their visitor
unknown.sender = the sender

; How the fallback title of a letter reads, when the letter's own title is
; missing or too long: a book's title holds 24 characters, so the sender's
; name is shortened until the whole title fits. The item card is the line
; under a letter's name in the inventory.
[Letter]
fallback_title = Note from {sender}
item_card = A sealed letter.

; ============================================================================
; The event timeline
; ============================================================================

; How the dashboard's event list, and the event history log, word what has
; been happening around the player. The Director reads the same events, but
; its prompts word them for themselves. The log is always in English.

; One entry of the list: {age} is how long ago, {body} what happened.
[Event]
line = [{age}] {body}
idle = Nothing notable has happened for {duration}
idle_long = Nothing notable has happened for over an hour

; How long ago something happened, in its coarsest whole unit.
[Event.Age]
moment = just now
minute = {n, plural, one {# minute ago} other {# minutes ago}}
hour = {n, plural, one {# hour ago} other {# hours ago}}
day = {n, plural, one {# day ago} other {# days ago}}
week = {n, plural, one {# week ago} other {# weeks ago}}
unknown = recent

; How long something has gone on, as in "for 5 minutes".
[Event.Duration]
moment = less than a minute
minute = {n, plural, one {# minute} other {# minutes}}
hour = {n, plural, one {# hour} other {# hours}}
day = {n, plural, one {# day} other {# days}}
week = {n, plural, one {# week} other {# weeks}}

; SkyrimNet's own events. A ".to" line is said to someone in particular.
; with_text follows a book's line with what the book says.
[Event.SkyrimNet]
dialogue = {speaker}: "{dialogue}"
dialogue.to = {speaker} -> {listener}: "{dialogue}"
player_dialogue = (player) {speaker}: "{dialogue}"
player_dialogue.to = (player) {speaker} -> {listener}: "{dialogue}"
gamemaster_dialogue = {speaker} -> {target} (topic: {topic}): {dialogue}
npc_thoughts = {name} (thinking): "{thoughts}"
death = {killer} killed {victim}
book_read = {reader} read "{title}"
book_read.untitled = {reader} read a book
book_read.with_text = <<<END
{line}:
{body}
END
unknown.reader = The player
no_data = (no data)

; Fighting near the player. A run of blows is summed up in one line: each
; pair's fight, then the damage that came from no one, each added by join.
; "several" opens a summary of more than one fight; "others" closes one that
; left some out. {source} is what dealt damage: a source.* line, or the name
; of what did it.
[Event.Combat]
combat_start = {actor} enters combat
combat_end = {actor} leaves combat
collapse = {actor} collapses
regain_footing = {actor} regains their footing
strike = {actor} strikes {target}
attack = {actor} attacks {target}
trade = {actor} and {target} trade blows
damage = {target} took damage
damage.from = {target} took damage from {source}
damage.repeated = {target} took repeated damage
damage.repeated.from = {target} took repeated damage from {source}
source.poison = poison
source.spell_trap = a spell trap
source.trap = a trap
several = Combat continues: {fights}
others = {fights}, and others
join = {first}; {then}

; A change in the weather the player would notice.
[Event.Weather]
blizzard_start = A blizzard has struck.
storm_intensify = The wind is picking up and the storm intensifies.
storm_subside = The storm is subsiding.
weather_shift = The weather has shifted.
storm_start = A thunderstorm is rolling in.
rain_start = Rain has started to fall.
snow_start = Snow is beginning to fall.
rain_stop = The rain has stopped.
snow_stop = The snow is letting up.
clear_start = The clouds have parted and the sun is coming out.
cloudy_start = The sky has clouded over.

; Where the player, and whoever travels with them, went. {party} is the
; player and their followers, {count} how many of them there are. An
; ".interior" line is a building or a dungeon rather than a place outdoors;
; ".nowhere" is for when where they came from is not known. journey and
; visit sum up a run of moves made close together.
[Event.Travel]
entered_location = {party, list} arrived at {place}.
entered_location.interior = {party, list} entered {place}.
left_location = {party, list} departed from {place}.
left_location.interior = {party, list} exited {place}.
crossed_holds = {party, list} crossed from {from} into {to}.
entered_wilderness = {party, list} departed from {origin} and {count, plural, one {is} other {are}} now in the wilderness of {hold}.
entered_wilderness.exited = {party, list} exited {origin} and {count, plural, one {is} other {are}} now in the wilderness of {hold}.
fast_travel_arrived = {party, list} arrived at {place}, having journeyed from {origin}.
fast_travel_arrived.interior = {party, list} entered {place}, having journeyed from {origin}.
fast_travel_arrived.nowhere = {party, list} arrived at {place}.
fast_travel_arrived.interior.nowhere = {party, list} entered {place}.
journey = {party, list} travelled from {origin} to {arrival}.
journey.to = {party, list} ended up in {arrival}.
journey.from = {party, list} set out from {origin}.
journey.nowhere = {party, list} travelled a while.
visit = {party, list} visited {places, list}.
visit.nowhere = {party, list} looked around.
unknown = {party, list} travelled somewhere.
unknown.player = The Player

; ============================================================================
; Debug notifications
; ============================================================================

; Shown only when bDebugNotifications is on: a testing aid that says things
; the character could not know.
[Notify]
courier = [NE] The courier has a letter for you
visitor = [NE] {visitor} is coming to see you
rumor = [NE] New rumor spreading from {origin}
ambush = [NE] Ambush spawned: {group} ({attackers} attackers)
unknown.visitor = Someone
unknown.person = someone
unknown.group = unknown group

; ============================================================================
; Matching
; ============================================================================

; Words the plugin looks for in names and in what the model writes, in this
; language. Comma-separated.
;
; Title.Strip.Start: titles a letter's fallback title may drop from the front
; of a sender's name. Title.Strip.After: the word an epithet follows, so that
; "Balgruuf the Greater" can become "Balgruuf".
[Matching]
Title.Strip.Start = Jarl, Thane, Master, Mistress, Captain, Commander, Housecarl, Lord, Lady, Sir, Brother, Sister, Mother, Father
Title.Strip.After = the

; ============================================================================
; Plots seeded for testing
; ============================================================================

; The two test plots the dashboard can seed, and the hand-seeded debug plot.
; Saved and remembered like any other plot, so they are in each language too.
[Plot.Test]
brelyna.ambition = Be known as the most promising apprentice the College has.
brelyna.scheme = Have J'zargo lose his place as Tolfdir's favoured apprentice.
brelyna.finish = Denounce J'zargo to Mirabelle Ervine.
tolfdir.ambition = Keep the College safe from those who would use it for their own ends.
tolfdir.scheme = Prove to Savos Aren that Ancano has been prying into the College's secrets.
tolfdir.finish = Show the proof against Ancano to Savos Aren.
college = the College of Winterhold
journal = a private journal
debug.mastermind = Debug Mastermind
debug.ambition = A hand-seeded plot, standing in until plot birth exists.
debug.scheme = Get the Amulet of Kings out of the Broker's hands and into hers.
debug.step.locate = Find out which of the Broker's rooms the amulet is kept in.
debug.step.surveil = Watch the estate until the household's evening routine is clear.
debug.step.acquire = Take the amulet during the hour the study stands empty.

; ============================================================================
; The Director's decision log
; ============================================================================

; How a decision that went wrong reads on the dashboard and in the Director's
; own history. {detail} is what it was about, as it came: a beat's id, the
; model's reply, or why its choice was refused.
[Decision]
failed = (failed: {reason})
reason.beat_missing = LLM-chosen beat '{detail}' missing from registry
reason.llm_error = LLM error: {detail}
reason.not_json = LLM response was not a JSON object: {detail}
reason.not_offered = LLM picked an option it was not offered on every attempt (last: {detail})
note.invalid_json = parse_failure: invalid JSON
note.not_an_object = parse_failure: response was not a JSON object
note.forced_dispatch = forced dispatch via debug UI
