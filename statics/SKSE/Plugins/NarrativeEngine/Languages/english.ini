; ============================================================================
; NarrativeEngine — English
; ============================================================================
;
; Every sentence NarrativeEngine shows a player, or writes into a memory, the
; co-save or the game, comes from a file like this one: one per language,
; named after Skyrim's own language setting (sLanguage), all UTF-8.
;
; English is the reference. Any key another language's file lacks, or gets
; wrong, is taken from here instead, one key at a time, and the log says
; which.
;
; Changing the words
; ------------------
; Do not edit this file to change a sentence: the next NarrativeEngine update
; replaces it. Put the lines you want to change in english.custom.ini beside
; it instead, under the same section, and they override these key by key.
; That file is never shipped, so updates never touch it.
;
; Templates
; ---------
;   {agent}                                         a value; a person's name
;   {agent, select, female {...} male {...} other {...}}
;                                                   chosen by a person's sex
;   {days, plural, one {# day} other {# days}}      chosen by a number
;   {names, list}                                   a list, joined as [Grammar] says
;   {scheme, phrase}                                text trimmed to sit inside a sentence
;
; A brace that is not part of one of these is an error, and the line falls
; back to English. Each key takes only the placeholders the plugin supplies
; for it; the log names any line that uses one it does not.
;
; Comments must be on their own line. A ';' after a value is part of it.

[Language]
Name = English
NativeName = English
Code = en
Status = reviewed
PluralRule = one_other
Fonts = en, pl, ru, ja, cn

; Wrap a value in double quotes to keep spaces at either end of it.
[Grammar]
ListSeparator = ", "
ListPairSeparator = " and "
ListFinalSeparator = ", and "
CapitalizeSentenceStart = true
PhraseTrailingPunctuation = ".!?;,"
PhraseLowercaseFirst = true
