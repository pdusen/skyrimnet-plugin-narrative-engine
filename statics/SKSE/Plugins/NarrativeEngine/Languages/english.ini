threaten.line = {agent} warns {mark} to stay out of {mastermind}'s affairs.
threaten.caption = Threaten
spread_rumors.line = {agent} spreads ugly talk about {mark} around {place}.
spread_rumors.caption = Spread Rumors
denounce.line = {agent} denounces {mark} to {authority}.
denounce.caption = Denounce
