fletch.caption = Fletch

; The memories a step writes, in the voice of who keeps them:
;   agent_dispatched        the agent, on being sent
;   mastermind_dispatched   the mastermind, on sending them
;   self_dispatched         a mastermind who did it themselves
;   agent_succeeded / agent_failed / agent_timed_out
;                           the agent, on how it went
;   mastermind_told_*       the mastermind, on hearing how it went
