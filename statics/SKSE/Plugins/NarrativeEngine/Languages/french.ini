reengage = L'interruption terminée, {visitor} se tourne de nouveau vers {player} pour tenter de reprendre la discussion là où elle s'était arrêtée.
unknown.player.opening = Le joueur
unknown.player = le joueur
unknown.visitor = son visiteur
unknown.sender = l'expéditeur

; Le titre de secours d'une lettre, quand son propre titre manque ou est trop
; long : un titre de livre tient en 24 caractères, et le nom de l'expéditeur
; est raccourci jusqu'à ce que le tout tienne. La fiche d'objet est la ligne
; sous le nom de la lettre dans l'inventaire.
[Letter]
fallback_title = Lettre de {sender}
item_card = Une lettre cachetée.

; ============================================================================
; La chronologie des événements
; ============================================================================

; Comment la liste d'événements du tableau de bord, et le journal d'historique
; des événements, racontent ce qui se passe autour du joueur. Le Directeur lit
; les mêmes événements, mais ses prompts les formulent à leur façon. Le
; journal est toujours en anglais ; le tableau de bord utilise cette langue.

; Une entrée de la liste : {age} indique quand, {body} ce qui s'est passé.
[Event]
line = [{age}] {body}
idle = Rien de notable ne s'est produit depuis {duration}
idle_long = Rien de notable ne s'est produit depuis plus d'une heure

; Il y a combien de temps, dans la plus grande unité entière.
