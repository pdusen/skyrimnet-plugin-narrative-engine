day = {n, plural, one {il y a # jour} other {il y a # jours}}
week = {n, plural, one {il y a # semaine} other {il y a # semaines}}
unknown = récemment

; Depuis combien de temps quelque chose dure, comme dans « depuis 5 minutes ».
[Event.Duration]
moment = moins d'une minute
minute = {n, plural, one {# minute} other {# minutes}}
hour = {n, plural, one {# heure} other {# heures}}
day = {n, plural, one {# jour} other {# jours}}
week = {n, plural, one {# semaine} other {# semaines}}

