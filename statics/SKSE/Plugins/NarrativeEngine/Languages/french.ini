; ============================================================================
; Forme des contenus demandés au modèle
; ============================================================================

; Ce que le prompt (en anglais) demande au modèle pour chaque champ, afin que
; le texte s'insère dans les modèles ci-dessus. Va de pair avec [Matching].
[Prompt.Form]
scheme = a bare French infinitive clause that opens with its verb, with no subject and no leading "de", "pour" or "à" (a reflexive "se" or "s'" is fine), e.g. "voler l'Amulette des rois au Courtier"

; ============================================================================
; Correspondances
; ============================================================================

; Comment le plugin lit les noms et ce qu'écrit le modèle, dans cette langue.
;
; Une vérification s'écrit en listes, selon l'endroit du texte où elles
; regardent :
;   <Check>.Reject.Start / .Reject.End     le texte ne doit pas commencer / finir ainsi
;   <Check>.Require.Start / .Require.End   le texte doit commencer / finir ainsi
;   <Check>.Match.Start / .End / .Anywhere un détecteur, trouvé à cet endroit
;   <Check>.Disabled = <raison>            la vérification est désactivée
; Chaque liste est séparée par des virgules. Une entrée est une suite de mots
; séparés par des espaces, et * dans un mot remplace n'importe quelles
; lettres : « * est » est un mot quelconque suivi de « est », et « l'* »
; attrape « l'amulette ». La casse ne compte jamais.
;
; Scheme : le plan est cité dans « mon plan pour ... » dans chaque souvenir
; d'intrigue ; il doit donc être une proposition infinitive (voir
; [Prompt.Form]). Ce qui le trahit est au début : un pronom sujet, un article,
; un possessif, « de », « pour », « à » ou « que » en tête, ou un nom suivi de
; ce qu'il compte faire.
;
; PlayerTitle : ce que le modèle appelle le joueur quand il parle de lui.
;
; Ghost : une apparition que l'indicateur de fantôme du jeu ne signale pas le
; dit dans son nom, au début (« Fantôme dunmer ») ou à la fin (« Aventurier
; fantôme »).
;
; Listes simples :
; Name.Suffixes : les terminaisons qu'un nom de personne peut porter dans un
; texte. Le français n'en ajoute aucune.
; Name.Titles : les titres trop répandus pour désigner quelqu'un : « Capitaine »
; seul ne désigne aucun capitaine en particulier.
; Item.Articles : ce par quoi le nom d'un objet peut commencer, comme l'écrit
; [Plot.Item].
; Title.Strip.Start : les titres que le titre de secours d'une lettre peut
; retirer du début du nom de l'expéditeur. Title.Strip.After : les mots après
; lesquels vient une épithète, pour que « Balgruuf le Grand » devienne
; « Balgruuf ».
[Matching]
