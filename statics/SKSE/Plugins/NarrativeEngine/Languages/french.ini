; ============================================================================
; NarrativeEngine — Français
; ============================================================================
;
; Chaque phrase que NarrativeEngine montre au joueur, ou écrit dans un
; souvenir, le co-save ou le jeu, vient d'un fichier comme celui-ci : un par
; langue, nommé d'après le réglage de langue de Skyrim (sLanguage), en UTF-8.
;
; L'anglais (english.ini) fait référence. Toute clé absente de ce fichier, ou
; erronée, est reprise de l'anglais, clé par clé, et le journal indique
; lesquelles.
;
; Modifier les textes
; -------------------
; Ne modifiez pas ce fichier : la prochaine mise à jour de NarrativeEngine le
; remplace. Placez les lignes à changer dans french.custom.ini, à côté de
; celui-ci, sous la même section : elles remplacent celles-ci clé par clé. Ce
; fichier n'est jamais distribué, les mises à jour n'y touchent donc jamais.
;
; Modèles
; -------
;   {agent}                                         une valeur ; le nom d'une personne
;   {agent, select, female {...} male {...} other {...}}
;                                                   choisi selon le sexe d'une personne
;   {days, plural, one {# jour} other {# jours}}    choisi selon un nombre
;   {names, list}                                   une liste, jointe comme le dit [Grammar]
;   {scheme, phrase}                                un texte ajusté pour tenir dans une phrase
;
; Une accolade qui ne fait pas partie de l'une de ces formes est une erreur, et
; la ligne revient à l'anglais. Chaque clé n'accepte que les paramètres que le
; plugin lui fournit ; le journal signale toute ligne qui en utilise un autre.
;
; Les commentaires doivent être sur leur propre ligne. Un ';' après une valeur
; en fait partie.

[Language]
Name = French
NativeName = Français
Code = fr
Status = draft
PluralRule = french
Fonts = en, pl, ru, ja, cn

; Entourez une valeur de guillemets pour garder les espaces à ses extrémités.
[Grammar]
ListSeparator = ", "
ListPairSeparator = " et "
ListFinalSeparator = " et "
CapitalizeSentenceStart = true
PhraseTrailingPunctuation = ".!?;,"
PhraseLowercaseFirst = true
; L'article de l'anglais (a/an) : le français accorde le sien avec le genre du
; nom, donc ces deux clés restent vides et [Plot.Item] s'en passe.
IndefiniteArticle =
IndefiniteArticleBeforeVowel =

; ============================================================================
; Intrigues
; ============================================================================
;
; Une intrigue est un plan mené en étapes, et chaque étape est l'un des verbes
; d'un ensemble fixe (surveiller, voler, dénoncer...). Les phrases de chaque
; verbe sont indexées par son identifiant. Elles peuvent nommer {agent}, qui
; mène l'étape ; {mastermind}, l'instigateur du plan ; {scheme}, le plan
; lui-même ; et les emplacements propres au verbe ({mark}, {item}, {place}...).
; {scheme, phrase} ajuste le plan pour le milieu d'une phrase :
; « mon plan pour {scheme, phrase}. » Le plan est une proposition infinitive
; (voir [Prompt.Form]).

; La phrase du tableau de bord pour une étape, et la légende sous son nœud.
[Plot.Dashboard]
