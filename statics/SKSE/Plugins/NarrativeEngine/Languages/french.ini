; Lettres
; ============================================================================

; Le souvenir qu'a l'auteur d'avoir envoyé une lettre, qui la cite ensuite.
[Letter.Memory]
sent = <<<END
J'ai écrit et envoyé une lettre à {recipient}. En voici le contenu :

{body}
END
unknown.recipient = mon correspondant

