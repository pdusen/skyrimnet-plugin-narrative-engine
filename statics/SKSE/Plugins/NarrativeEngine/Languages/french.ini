; ============================================================================
; Rumeurs
; ============================================================================

; Comment un auditeur se souvient d'avoir entendu une rumeur, et un conteur de
; l'avoir racontée. {band} est le texte de la rumeur, une phrase ou plusieurs :
; chaque introduction se termine donc par deux-points plutôt que par « que ».
; {kin} est le mot du jeu pour le lien de parenté, mais le jeu ne le traduit
; pas (il reste en anglais) : ces lignes s'en passent. {hold} est la
; châtellerie d'où venait le conteur, ou unknown.hold.
[Gossip.Memory]
heard.kin_from_away = {teller, select, female {Ma parente {teller} est revenue} other {Mon parent {teller} est revenu}} de {hold} avec des nouvelles : {band}
heard.kin = {teller, select, female {Ma parente} other {Mon parent}} {teller} m'a raconté ceci : {band}
heard.household = {teller} m'a raconté ceci pendant le souper : {band}
heard.settlement = {teller} m'a raconté ceci : {band}
heard.rumor = J'ai entendu une rumeur qui court : {band}
told = J'ai raconté ceci à {listeners, list} : {band}
unknown.person = quelqu'un
unknown.hold = loin

