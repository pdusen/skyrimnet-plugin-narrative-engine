; them: the Stormcloaks' Jarl of Whiterun and his steward are both quartered
; with the Companions and are in no Whiterun faction at all. Without the two
; lines, taking Whiterun for the Stormcloaks would leave the hold with a
; housecarl and no one to serve. Vignar also heads the Gray-Mane section
; above, which is where his standing sits while Balgruuf holds the keep.

