; ============================================================================
; HOLD COURTS
; ============================================================================
;
; Nine holds and one council, all on the ladder described in the header. Each
; section is the same six markers scoped by that hold's crime faction; the
; Member lines are where vanilla's data and the actual court disagree.
;
; A COURT IS WHO HOLDS THE OFFICE, AND THAT CHANGES AS YOU PLAY.
;
; The job factions hold the understudy as well as the incumbent --
; JobJarlFaction has Balgruuf AND Vignar Gray-Mane, JobHousecarlFaction has
; Unmid Snow-Shod AND Maul. Seating both puts two jarls in every hold and lets
; a man who holds no office give orders to the sitting steward, which is the
; one thing a hierarchy is supposed to prevent. Seating only the incumbent is
; no better: it is right until the civil war moves and wrong forever after.
;
; Vanilla tracks this itself, and every court below reads the answer live:
;
;   OfficeFaction   = GovRuling
;   OfficeCandidate = GovImperial
;   OfficeCandidate = GovSons
;
; GovImperial and GovSons are the two governments a hold can be given;
; GovRuling is the one it currently has. CWGovernmentScript maintains them at
; runtime -- installing a court calls AddToFaction(GovRuling), exiling one
; calls RemoveFromFaction(GovRuling) -- so "is this person in GovRuling right
; now" is exactly the question, and it is the same question the game's own
; script asks before it moves anybody.
;
; A courtier in neither GovImperial nor GovSons is untouched by the gate, and
; that is correct rather than a gap: court wizards never relocate when a hold
; changes hands, and Solitude's government is never replaced at all.
;
; The gate is applied AFTER the Member lines, not before, and that ordering is
; what makes both halves work. Hrongar is demoted off the jarl rung by a Member
; line because vanilla marks him one and he is not; he still leaves the court
; entirely when his brother is driven out of Dragonsreach. Olfina Gray-Mane
; needs no line at all -- she is marked a housecarl, holds no office today, and
; becomes one the moment her great-uncle takes the keep.
;
; This is read fresh for every tick rather than at load, because the answer
; lives on the actor and not in the plugin: AddToFaction writes to the
; reference, while the base record keeps the values Bethesda shipped and never
; moves.

