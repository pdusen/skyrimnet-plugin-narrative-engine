; ============================================================================
; NarrativeEngine — Plot Factions
; ============================================================================
;
; This file tells the faction-plot simulation WHO OUTRANKS WHOM. It is content,
; not tuning — how many plots run at once and how fast they move live in
; NarrativeEngine.ini under [Plots] instead.
;
; You are meant to edit this file. Adding a faction, retuning one, or throwing
; the whole set out and writing your own is a text edit; no rebuild, no
; scripting, nothing to recompile. Restart the game to pick up changes.
;
; ----------------------------------------------------------------------------
; WHAT THIS FILE IS, AND IS NOT
; ----------------------------------------------------------------------------
;
; It is NOT a list of who may take part in a plot. Anyone can. Plots are cast
; from the whole unique-NPC population, and an NPC who belongs to no faction at
; all can still mastermind one.
;
; What this file adds is HIERARCHY. A faction listed here has a known internal
; pecking order, so the simulation knows that Savos Aren outranks a College
; apprentice and can weight him accordingly when choosing who has the standing
; to run a scheme — and knows who he can plausibly give orders to.
;
; A faction NOT listed here still counts. Its members are simply peers: being
; in it says "this person belongs to an organisation", and nothing about rank.
;
; ----------------------------------------------------------------------------
; WHY THIS FILE HAS TO EXIST
; ----------------------------------------------------------------------------
;
; Because Skyrim's data does not answer the question on its own, and we
; measured that rather than assuming it.
;
; Faction rank is authored on the NPC record and would be the obvious source.
; Of the ~857 unique NPCs the simulation draws from, exactly one faction — the
; College of Winterhold — actually populates a rank ladder. Everyone else sits
; at rank 0, including Ulfric Stormcloak in the Stormcloaks, Kodlak Whitemane
; in the Companions, and Astrid in the Dark Brotherhood. Vanilla drives guild
; rank through quests at runtime instead.
;
; Two heuristics were tried and measured before falling back to declaring it:
;
;   * Property ownership. Measures wealth, not authority — innkeepers own inns,
;     so Keerava outranked Ulfric.
;   * Faction nesting (a small faction inside a big one). Fires for 65% of the
;     population once household, location and per-vendor factions are counted.
;
; So: declare it. Three methods below cover the three shapes the data actually
; comes in.
;
; ----------------------------------------------------------------------------
; HOW A BAD EDIT BEHAVES
; ----------------------------------------------------------------------------
;
; Each [Faction:<id>] section is validated on its own. If one section is
; broken, THAT SECTION is skipped with a specific reason in the log and every
; other section still loads. A typo in your fifth faction never costs you the
; four that were fine.
;
; A key this version of the plugin doesn't recognize is warned about and
; ignored, not treated as an error — so a file written for a newer build still
; works on an older one.
;
; When something doesn't show up, read Data/SKSE/Plugins/NarrativeEngine.log
; and search for "PlotFactions". Every skip says which section and why.
;
; ----------------------------------------------------------------------------
; KEYS
; ----------------------------------------------------------------------------
;
;   Faction      REQUIRED. EditorID of the PRIMARY faction — the organisation
;                itself. CompanionsFaction, not CompanionsHarbingerFaction.
;                The marker factions go on MarkerFaction below.
;
;   DisplayName  REQUIRED. How the faction is named in the dashboard and in
;                the context handed to the LLM. Write it the way a person in
;                Skyrim would say it.
;
;   RankMethod   REQUIRED. Rank, Marker, or Explicit. See below.
;
;   Membership   Optional, default Faction. Who counts as a member.
;                    Faction  everyone in the primary faction
;                    Ranked   only the people the ladder actually places
;                See "COURTS, AND WHY MEMBERSHIP EXISTS" below.
;
;   OfficeFaction    Optional, and only meaningful with OfficeCandidate.
;   OfficeCandidate  The TENURE GATE, for a hierarchy whose membership the
;                    game rearranges as it is played. See "COURTS" below.
;                        OfficeFaction   = <FactionEditorID>
;                        OfficeCandidate = <FactionEditorID>   (repeatable)
;                    Anyone in one of the candidate factions counts only
;                    while they are ALSO in the office faction. Anyone in
;                    none of them is untouched. Both keys or neither.
;
;   Enabled      Optional, default true. Switch a faction off without
;                deleting its section.
;
;   Member       Optional, repeatable, and VALID UNDER EVERY METHOD.
;                    Member = <NpcEditorID>, <rank>
;                A manual override, layered on top of whatever the method
;                worked out. Use it to correct one NPC the data gets wrong
;                without hand-writing a whole ladder. Higher is more senior.
;                An EditorID that doesn't resolve costs you that LINE, not the
;                section — a mod that replaces one NPC should not cost you the
;                faction.
;                    Member = <NpcEditorID>, 0
;                is how you say "the data puts this person on a rung and it is
;                wrong": it demotes them to the bottom, and under
;                Membership = Ranked it drops them from the faction outright.
;
; ----------------------------------------------------------------------------
; THE THREE RANK METHODS
; ----------------------------------------------------------------------------
;
;   RankMethod = Rank
;       Read the faction rank authored on each NPC. Use this when the faction
;       genuinely populates its rank ladder.
;         MaxRank    REQUIRED. The top of the ladder. Standing is expressed as
;                    a fraction of it, so a shallow hierarchy and a deep one
;                    are comparable.
;
;   RankMethod = Marker
;       Seniority comes from membership of separate, more exclusive factions.
;       Use this when leadership is expressed as "is also in this other
;       faction" — which is how vanilla marks most guild leaders.
;         MarkerFaction  REQUIRED, repeatable, IN DESCENDING ORDER OF
;                        SENIORITY. Everyone in the primary faction who is in
;                        none of them shares the bottom rung. An NPC in two
;                        takes the more senior.
;
;   RankMethod = Explicit
;       No derivation at all — the Member lines ARE the ladder. The last-ditch
;       method, for factions where the data says nothing useful. Anyone
;       unlisted stays at the bottom, which is fine: you only need to name the
;       people who matter.
;
; ----------------------------------------------------------------------------
; A NOTE ON RANK NUMBERS
; ----------------------------------------------------------------------------
;
; Standing is normalised per faction before it is used, so the numbers only
; have to be right RELATIVE TO EACH OTHER inside one section. The head of a
; two-rung faction and the head of a seven-rung faction weigh the same — being
; the head of your organisation means the same thing whether that organisation
; kept a deep hierarchy or a shallow one.
;
; ----------------------------------------------------------------------------
; COURTS, AND WHY MEMBERSHIP EXISTS
; ----------------------------------------------------------------------------
;
; A hold court is a real power structure — the jarl gives orders, the steward
; runs the hold, the housecarl commands the soldiery — and vanilla gives it no
; faction of its own. There is no WhiterunCourtFaction. What there is:
;
;   * province-wide JOB factions (JobJarlFaction, JobStewardFaction, ...) that
;     say what someone does but not where, and
;   * a per-hold CRIME faction that says where someone lives but not what they
;     do, and holds every farmer in the hold alongside the jarl.
;
; Crossing the two answers the question: the jarl OF THIS HOLD is whoever is
; in JobJarlFaction and in CrimeFactionWhiterun. That is exactly a Marker
; ladder read through a primary faction, so the ranking needs no new
; machinery.
;
; What IS needed is a way to say the court is not the whole hold. Under the
; default the primary faction defines membership, which would enrol all 93
; residents of Whiterun Hold as courtiers — false on its face, and it would
; hand every NPC in Skyrim the "belongs to an organisation" bonus that the
; mastermind weighting uses to tell joiners from independents.
;
;   Membership = Ranked
;
; narrows membership to the people the ladder actually places: someone on a
; marker rung, or named by a Member line with a rank above 0. The primary
; faction stops being the roll and becomes the SCOPE. Under Ranked a Member
; line can therefore admit someone the primary faction misses, which is how
; Brill — Vignar Gray-Mane's steward, and in no Whiterun faction at all —
; reaches the court he actually runs.
;
; The court ladder used below, most senior first:
;
;   Jarl > Steward > Housecarl > Court Wizard > Guard Captain > Guard
;
; UESP's Steward article states the top of it outright — "in court politics,
; stewards are second only to the jarl, being more important than both
; housecarls and court wizards" — and its Court Wizard article calls housecarl
; and court wizard equals. We break that one tie in the housecarl's favour,
; deliberately: this simulation asks who can be given an order, and the
; housecarl is the one who commands the hold's soldiery.
;
; IsGuardFaction is the bottom rung rather than the per-hold GuardFaction*
; because two holds (Hjaalmarch, Winterhold) have no per-hold guard faction at
; all. Scoped by the hold's crime faction it is clean: the only unique NPCs it
; catches are the guards themselves. Unscoped it would also catch the
; Companions and every orc stronghold, which is why the scope is not optional.
;
; ============================================================================


; ============================================================================
; GUILDS, ORDERS AND OTHER STANDING ORGANISATIONS
; ============================================================================

; --- Rank: the one faction whose authored ladder is actually populated ------

