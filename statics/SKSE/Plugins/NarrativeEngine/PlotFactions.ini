;
; Hrongar is in JobJarlFaction, which he should not be: he was written as
; Balgruuf's replacement for a quest that was cut, and the membership was left
; behind. He is the Jarl's brother and belongs at the table rather than on the
; throne — and he is exiled with Balgruuf, which the gate handles without this
; line having to know about it. Avulstein Gray-Mane is the same kind of
; leftover in JobHousecarlFaction and was never anyone's housecarl at all, so
; he leaves the court under either flag.
