; ============================================================================
; NarrativeEngine — Plot Items
; ============================================================================
;
; The pool an `Acquire` step draws from: the things a scheme can be about
; getting hold of. Content, not tuning — how often plots run and how hard their
; steps are live in NarrativeEngine.ini under [Plots].
;
; You are meant to edit this file. Adding an item, removing one, or replacing
; the whole pool with objects from your own mod is a text edit; no rebuild, no
; scripting, nothing to recompile. Restart the game to pick up changes.
;
; ----------------------------------------------------------------------------
; WHY THIS FILE EXISTS
; ----------------------------------------------------------------------------
;
; Because the alternative is letting the LLM name an object, and it will name
; objects that do not exist. "The Jarl's signet ring" is a perfectly good story
; beat and there is no such record in Skyrim; a plot built on one is a plot
; that can never be finished, delivered to the player, or written into a
; memory that says anything true.
;
; So the model does not get to invent the noun. It gets a MENU, built from this
; file, and picks an index off it. Everything on the menu is a real `TESForm`
; that was resolved at load, which is what lets a step's object be put in an
; inventory, named in a journal entry, and pointed at by a quest marker.
;
; It is curated rather than generated for the same reason. Skyrim has thousands
; of takeable objects and almost none of them are worth scheming over: a scheme
; about acquiring a wooden bowl is not a scheme. What belongs here is anything
; whose loss or possession could plausibly matter to somebody.
;
; ----------------------------------------------------------------------------
; HOW A BAD EDIT BEHAVES
; ----------------------------------------------------------------------------
;
; Each line is validated on its own. An EditorID that does not resolve costs
; you THAT LINE, named in the log, and every other line still loads — a mod
; that removes one object should not cost you the pool.
;
; If the whole file is missing, `Acquire` steps fall back to naming no object
; at all. They still run; they are just vaguer. Deleting this file degrades the
; feature, it does not break it.
;
; When something doesn't show up, read Data/SKSE/Plugins/NarrativeEngine.log
; and search for "PlotItems".
;
; ----------------------------------------------------------------------------
; FORMAT
; ----------------------------------------------------------------------------
;
;   <Category> = <EditorID>, <how a person would say it>
;
; The category is the key and repeats as often as you like. Four are
; recognised; anything else is warned about and ignored, so a file written for
; a newer build still works on an older one.
;
;   Valuable    portable wealth — worth taking, worth missing
;   Document    paper that proves something
;   Contraband  illegal to hold, worse to be caught holding
;   Drink       what gets poisoned, watered, stolen or switched
;
; The category is not a rule the simulation enforces. It is context handed to
; the model so that a blackmail scheme reaches for a document and a smuggling
; one reaches for skooma, rather than either reaching for a garnet.
;
; The display name is written the way somebody would say it out loud, lower
; case and with its article, because it is dropped into a sentence: "acquire a
; bottle of Black-Briar mead", not "acquire FoodBlackBriarMead".
;
; ============================================================================

[Items]

; ---- Valuables --------------------------------------------------------------
; Small, portable, and worth enough that taking one is a decision.

Valuable = Gold001, a purse of septims
Valuable = GemRuby, a ruby
Valuable = GemDiamond, a diamond
Valuable = GemEmerald, an emerald
Valuable = GemSapphire, a sapphire
Valuable = GemAmethyst, an amethyst
Valuable = GemGarnet, a garnet
Valuable = IngotGold, a gold ingot
Valuable = IngotEbony, an ebony ingot
Valuable = IngotQuicksilver, a quicksilver ingot
Valuable = SilverPlatter01, a silver platter
Valuable = AncientNordAmulet, an ancient Nord amulet

; ---- Documents --------------------------------------------------------------
; The most useful category by a distance: a document is the only object that
; can BE the evidence a scheme turns on, rather than merely being expensive.

Document = WIAddItem03Contract, a signed contract
Document = Book2CommonWindhelmLetters, a bundle of old letters

; ---- Contraband -------------------------------------------------------------
; Worth having, and worth far more planted on somebody else.

Contraband = Skooma, a bottle of skooma
Contraband = WindhelmDoubleDistilledSkooma, a bottle of double-distilled skooma

; ---- Drink ------------------------------------------------------------------
; Named brands on purpose. Black-Briar mead belongs to somebody, which is what
; makes stealing a bottle of it a move against a person rather than a theft.

Drink = FoodBlackBriarMead, a bottle of Black-Briar mead
Drink = FoodBlackBriarMeadPrivateReserve, a bottle of Black-Briar Reserve
Drink = FoodHonningbrewMead, a bottle of Honningbrew mead
