; ============================================================================
; NarrativeEngine — Attacker Groups
; ============================================================================
;
; This file decides WHO can ambush you, and under what circumstances. It is
; content, not tuning — how many attackers appear and how far away they spawn
; live in NarrativeEngine.ini under [Beats] instead.
;
; You are meant to edit this file. Adding a group, retuning one, or throwing
; the whole set out and writing your own is a text edit; no rebuild, no
; scripting, nothing to recompile. Restart the game to pick up changes.
;
; ----------------------------------------------------------------------------
; HOW A BAD EDIT BEHAVES
; ----------------------------------------------------------------------------
;
; Each [Group:<id>] section is validated on its own. If one group is broken,
; THAT GROUP is skipped with a specific reason in the log and every other
; group still loads. A typo in your fifth group never costs you the four that
; were fine.
;
; A key this version of the plugin doesn't recognize is warned about and
; ignored, not treated as an error — so a group file written for a newer
; build still works on an older one.
;
; When something doesn't show up, read Data/SKSE/Plugins/NarrativeEngine.log
; and search for "AttackerGroups". Every skip says which section and why.
;
; ----------------------------------------------------------------------------
; ROSTER KEYS
; ----------------------------------------------------------------------------
;
; Values are EditorIDs of leveled-character (LVLN) records — the same names
; you'd see in the Creation Kit or xEdit. Not FormIDs, so you never have to
; think about load order.
;
;   LineForm    The rank and file. REQUIRED — at least one. May be repeated
;               to draw from several lists; repeats are used round-robin so
;               the mix comes out even.
;   RangedForm  Optional. Roughly one attacker in three will be drawn from
;               this list instead.
;   LeaderForm  Optional. One, and only when the ambush has 3+ attackers.
;
; ----------------------------------------------------------------------------
; ELIGIBILITY KEYS
; ----------------------------------------------------------------------------
;
; Every eligibility key is optional. Leaving one out means "no constraint".
; A group with no eligibility keys at all can ambush you anywhere, any time.
;
;   *** Different keys AND together. Repeating one key ORs its values. ***
;
; So RequireHold twice means "either hold", while RequireHold plus
; RequireGameHour means "that hold AND that time of day".
;
; The one exception is RequireGlobal, where each occurrence must hold. Every
; other key names one thing on a shared dimension ("which hold?"), so repeats
; read naturally as alternatives; a RequireGlobal names a different variable
; each time, so repeats are additional requirements. Every Forbid* key means
; "none of these may match", however many you list.
;
;   Enabled                 true / false. Master switch — see below.
;   DisplayName             Human-readable name shown to the Director.
;   Flavor                  One line telling the Director who these people
;                           are and why they'd attack you. This is what the
;                           LLM reasons about, so it is worth writing well.
;
;   RequireHold             Hold-level location EditorID (e.g.
;   ForbidHold              WhiterunHoldLocation). Must be a HOLD, not a city
;                           — WhiterunLocation is the city and will be
;                           rejected with a message telling you so.
;   RequirePlayerInFaction  Faction EditorID; tests the player's membership.
;   ForbidPlayerInFaction
;   RequirePlayerKeyword    Keyword EditorID; tests the player. This is how
;   ForbidPlayerKeyword     vampirism is detected (the `Vampire` keyword).
;   RequireQuestComplete    Quest EditorID. Prefer this over RequireQuestStage
;   ForbidQuestComplete     — no magic numbers, and it handles quests with
;                           several ending stages by itself.
;   RequireQuestStage       <QuestEditorID> <op> <stage>, for when a specific
;   ForbidQuestStage        branch matters. Reads the quest's LATEST stage.
;   RequireGlobal           <GlobalEditorID> <op> <value>. A lot of Skyrim's
;                           progression state lives in globals rather than in
;                           faction membership.
;   RequireGameHour         <start>-<end> in 24-hour game time. WRAPS across
;                           midnight, so 20-6 means 8pm through 6am.
;   MinPlayerLevel          Integers. Handy for holding a nastier group back
;   MaxPlayerLevel          until the player can survive it.
;
; <op> is one of:  =  !=  >  <  >=  <=
;
; ----------------------------------------------------------------------------
; TURNING A GROUP OFF
; ----------------------------------------------------------------------------
;
; Set Enabled = false. The group keeps its configuration but is never
; considered — the Director can't even see it. That is deliberately nicer
; than deleting the block: flip one word now, flip it back in a month.
;
; A disabled group is still checked for errors at load, so re-enabling it
; later can't surprise you with a mistake that was hiding all along.
;
; ----------------------------------------------------------------------------
; ONE GROUP MUST BE UNCONSTRAINED
; ----------------------------------------------------------------------------
;
; `bandits` below has no eligibility keys at all, on purpose. It is the
; guarantee that SOMETHING can always ambush you; every other group layers on
; top of it as your playthrough earns it.
;
; Disabling `bandits` is a legitimate thing to want — just add another
; unconstrained group in its place, or accept that ambushes stop happening
; anywhere you haven't unlocked a gated group. The plugin logs a warning at
; startup if no enabled group is unconstrained, because that is otherwise
; impossible to notice from inside the game.
;
; ----------------------------------------------------------------------------
; A NOTE ON THE DLC GROUPS
; ----------------------------------------------------------------------------
;
; Three groups (`cultists`, `solstheim_reavers`, `rieklings`) need
; Dragonborn.esm. Without it their EditorIDs don't resolve, those three are
; skipped with a logged reason, and the other twelve load normally. Nothing
; to configure — the per-group isolation handles it.
;
; ============================================================================


; ---- The floor -------------------------------------------------------------
; No eligibility keys: always available, everywhere. See the note above on
; why this matters.

[Group:bandits]
Enabled     = true
DisplayName = Bandits
Flavor      = Opportunists working this stretch of road, in it for whatever you are carrying.
LineForm    = LCharBanditMeleeAny
RangedForm  = LCharBanditMissile
LeaderForm  = LCharBanditBoss


; ---- Region-gated ----------------------------------------------------------

[Group:forsworn]
Enabled     = true
DisplayName = Forsworn
Flavor      = Reachmen raiders who treat every road through the Reach as theirs by right.
LineForm    = LCharForswornMelee1H
RangedForm  = LCharForswornMissile
LeaderForm  = LCharForswornBossMelee1H
RequireHold = ReachHoldLocation

[Group:necromancers]
Enabled     = true
DisplayName = Necromancers
Flavor      = Practitioners driven out of Riften's crypts, hunting for fresh material.
LineForm    = LCharWarlockNecromancer
LeaderForm  = LCharWarlockBossNecro
RequireHold = RiftHoldLocation

; Repeated RequireHold — this is the OR case. Witches are at home in the
; Reach's crags and Falkreath's deep woods, and nowhere else in particular.
[Group:witches]
Enabled     = true
DisplayName = Witches
Flavor      = A coven that considers these woods theirs, and does not care to be walked through.
LineForm    = LCharWitchAny
RequireHold = ReachHoldLocation
RequireHold = FalkreathHoldLocation

[Group:solstheim_reavers]
Enabled     = true
DisplayName = Reavers
Flavor      = Solstheim's ash-choked answer to bandits, hardened by a place that kills the soft.
LineForm    = DLC2LCharBanditMelee1H
RangedForm  = DLC2LCharBanditMissile
LeaderForm  = DLC2LCharBanditBoss
RequireHold = DLC2SolstheimLocation

[Group:rieklings]
Enabled     = true
DisplayName = Rieklings
Flavor      = A raiding party of small blue tribals, dangerous entirely through numbers and nerve.
LineForm    = DLC2LCharRieklingMelee
RangedForm  = DLC2LCharRieklingMissile
LeaderForm  = DLC2LCharMountedRiekling
RequireHold = DLC2SolstheimLocation


; ---- Civil war -------------------------------------------------------------
; Keyed off the CWPlayerAllegiance global rather than faction membership.
; Faction membership very nearly works, but the Battle for Whiterun
; temporarily adds the player to the Imperial faction regardless of side; a
; save made inside that window would read a Stormcloak player as Imperial.
; The global has no such window:  0 = undecided, 1 = Imperial, 2 = Stormcloak.
;
; These two can never both be eligible — one global cannot hold two values.

[Group:stormcloak_raiders]
Enabled       = true
DisplayName   = Stormcloak raiders
Flavor        = Sons of Skyrim hunting one of the Legion's sworn allies.
LineForm      = LCharSoldierSons
RequireGlobal = CWPlayerAllegiance = 1

[Group:imperial_patrol]
Enabled       = true
DisplayName   = Imperial patrol
Flavor        = Legionnaires with orders regarding known Stormcloak sympathizers.
LineForm      = LCharSoldierImperial
RequireGlobal = CWPlayerAllegiance = 2


; ---- Gated on what you have done -------------------------------------------

; Before Diplomatic Immunity the Thalmor have no particular reason to know
; who you are. After you walk out of their embassy, they emphatically do.
[Group:thalmor]
Enabled              = true
DisplayName          = Thalmor justiciars
Flavor               = Aldmeri agents settling the embassy's account with you personally.
LineForm             = LCharThalmorMelee1H
RangedForm           = LCharThalmorMissile
LeaderForm           = LCharThalmorMagicBoss
RequireQuestComplete = MQ201

; DB02 is "With Friends Like These...", where Astrid has you kill one of the
; three captives and inducts you. Completing it covers both halves of "joined
; the Brotherhood and killed for them" in a single check.
;
; The ForbidQuestComplete is belt-and-braces: in vanilla the two are already
; mutually exclusive, since destroying the Brotherhood fails DB02. Kept
; because it costs a line, states the intent plainly, and survives a mod that
; reworks the branch.
[Group:penitus_oculatus]
Enabled              = true
DisplayName          = Penitus Oculatus
Flavor               = The Empire's counter-assassins, and hunting the Brotherhood is their whole job.
LineForm             = LCharPenitusOculatus
RequireQuestComplete = DB02
ForbidQuestComplete  = DBDestroy

; Miraak's followers start hunting you once the Dragonborn questline opens,
; and stop once he is dead. Note this group is DLC-dependent but NOT
; Solstheim-scoped — cultists coming to the mainland is the entire point.
[Group:cultists]
Enabled             = true
DisplayName         = Miraak's cultists
Flavor              = Masked fanatics sent across the sea to kill the false Dragonborn. That is you.
LineForm            = DLC2LCharCultist
LeaderForm          = DLC2LCharCultistSummoner
RequireQuestStage   = DLC2MQ01 >= 10
ForbidQuestComplete = DLC2MQ06

; MS08 is "In My Time of Need". Stage 200 is the ending where you help Saadia
; and kill Kematu; stage 201 is the one where you hand her over. An equality
; test rather than >= is deliberate — >= would also match 201, which is the
; ending where the Alik'r have no grudge against you at all.
[Group:alikr]
Enabled           = true
DisplayName       = Alik'r mercenaries
Flavor            = Hammerfell swordsmen collecting on the death of the man who hired them.
LineForm          = LCharAlikrMelee1H
LineForm          = LCharAlikrMelee2H
RangedForm        = LCharAlikrMissile
LeaderForm        = LCharAlikrMagic
RequireHold       = WhiterunHoldLocation
RequireQuestStage = MS08 = 200


; ---- Gated on what you are -------------------------------------------------

; The two holds with an established nest: Movarth's coven outside Morthal,
; and Castle Volkihar off the Haafingar coast. Note how the keys compose —
; the repeated RequireHold ORs the two holds, then ANDs against the hour
; window and the keyword test. So: one of those two holds, AND after dark,
; AND only if you are not a vampire yourself.
[Group:vampires]
Enabled             = true
DisplayName         = Vampires
Flavor              = A hunting party from a nearby nest, abroad while the sun is down.
LineForm            = LCharVampire
LeaderForm          = LCharVampireBoss
RequireHold         = HjaalmarchHoldLocation
RequireHold         = HaafingarHoldLocation
RequireGameHour     = 20-6
ForbidPlayerKeyword = Vampire

; The two Vigilant groups share a roster but are split into separate entries,
; because eligibility keys AND together and there is no "any of" operator.
; That turns out to be the better outcome anyway: hunting a vampire and
; hunting a werewolf want different Flavor text for the Director to work
; with. They can never both be eligible — vanilla does not let you be both.
[Group:vigilants_vampire_hunt]
Enabled              = true
DisplayName          = Vigilants of Stendarr
Flavor               = Stendarr's hunters, who have worked out what you have become.
LineForm             = LCharVigilantOfStendarr
RequirePlayerKeyword = Vampire

[Group:vigilants_beast_hunt]
Enabled       = true
DisplayName   = Vigilants of Stendarr
Flavor        = Stendarr's hunters, tracking the beast they know walks in your skin.
LineForm      = LCharVigilantOfStendarr
RequireGlobal = PlayerIsWerewolf = 1
